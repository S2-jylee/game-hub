<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>코딩 길찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="sc-grid"></div>
  <span class="sc-bit" style="--x:5%;--s:38px;--c:#2e9bff;--dur:19s;--d:-3s">➜</span>
  <span class="sc-bit" style="--x:17%;--s:30px;--c:#ff9500;--dur:23s;--d:-14s">↻</span>
  <span class="sc-bit" style="--x:29%;--s:42px;--c:#22c55e;--dur:27s;--d:-7s">🔁</span>
  <span class="sc-bit" style="--x:44%;--s:28px;--c:#ff4fa3;--dur:21s;--d:-18s">⬆</span>
  <span class="sc-bit" style="--x:58%;--s:36px;--c:#a259ff;--dur:25s;--d:-2s">⬅</span>
  <span class="sc-bit" style="--x:71%;--s:32px;--c:#2e9bff;--dur:20s;--d:-11s">⬇</span>
  <span class="sc-bit" style="--x:83%;--s:40px;--c:#ff9500;--dur:26s;--d:-20s">↺</span>
  <span class="sc-bit" style="--x:93%;--s:28px;--c:#22c55e;--dur:22s;--d:-6s">➜</span>
  <svg class="sc-bottom" viewBox="0 0 1200 200" preserveAspectRatio="none">
    <path d="M0 110 H160 V90 H320 V120 H520 V80 H700 V105 H880 V85 H1040 V110 H1200 V200 H0Z" fill="#c6f0d4"/>
    <path d="M0 150 H200 V135 H420 V155 H640 V130 H860 V150 H1060 V138 H1200 V200 H0Z" fill="#9fe0b5"/>
  </svg>
  <div class="sc-garden"><span style="--d:0s">🌱</span><span style="--d:.6s">🥕</span><span style="--d:1.2s">🌱</span><span style="--d:.3s">🌷</span><span style="--d:.9s">🥕</span><span style="--d:1.5s">🌱</span><span style="--d:.4s">🥕</span></div>
</div>

<!-- 타이틀 화면 -->
<section id="screen-title" class="screen active">
  <div class="title-card">
    <div class="title-shapes" aria-hidden="true">
      <span class="ts ts1">🐰</span>
      <span class="ts ts2">➡️</span>
      <span class="ts ts3">🥕</span>
      <span class="ts ts4">🔁</span>
    </div>
    <h1>코딩 길찾기</h1>
    <p class="subtitle">명령 블록을 늘어놓아 토끼를 당근까지 데려다줘요!</p>
    <button id="btn-start" class="btn btn-primary btn-huge">시작하기</button>
  </div>
</section>

<!-- 사용자 선택 화면 -->
<section id="screen-user" class="screen">
  <div class="card">
    <h2>누구인가요?</h2>
    <div id="user-list" class="user-list"></div>
    <div class="user-new-row">
      <input id="user-name-input" class="user-name-input" type="text" maxlength="10" placeholder="새 이름을 입력하세요">
      <button id="btn-user-new-start" class="btn btn-primary btn-small">시작</button>
    </div>
    <button id="btn-user-guest" class="btn btn-ghost">게스트로 시작</button>
    <button id="btn-user-back" class="btn btn-ghost">처음으로</button>
  </div>
</section>


<!-- 놀이 고르기 화면 -->
<section id="screen-mode" class="screen">
  <div class="card card-wide">
    <h2>무엇을 해볼까요? <span class="current-user-badge diff-tag"></span></h2>
    <div id="mode-grid" class="mode-grid"></div>
    <div class="result-buttons">
      <button id="btn-mode-title" class="btn btn-ghost">처음으로</button>
    </div>
  </div>
</section>

<!-- 스테이지 선택 화면 -->
<section id="screen-levelselect" class="screen">
  <div class="card card-wide">
    <h2><span id="levelselect-title">스테이지 고르기</span> <span class="current-user-badge diff-tag"></span></h2>
    <p class="stage-list-note">앞 스테이지를 깨면 다음 스테이지가 열려요.</p>
    <div id="level-grid" class="level-grid"></div>
    <div class="result-buttons">
      <button id="btn-levelselect-mode" class="btn btn-ghost">← 놀이 고르기</button>
    </div>
  </div>
</section>

<!-- 가이드북 화면: 문제 풀기 전에 읽어요 -->
<section id="screen-book" class="screen">
  <div class="book">
    <div class="book-head">
      <span id="book-title" class="book-title">📖 가이드북</span>
      <span id="book-page-num" class="diff-tag">1 / 6</span>
    </div>
    <div class="book-body">
      <button id="book-prev" class="book-arrow" type="button" title="앞 장">◀</button>
      <div id="book-page" class="book-page"></div>
      <button id="book-next" class="book-arrow" type="button" title="다음 장">▶</button>
    </div>
    <div id="book-dots" class="book-dots"></div>
    <div class="book-foot">
      <button id="book-close" class="btn btn-ghost btn-small">← 스테이지 고르기</button>
      <button id="book-skip" class="btn btn-small book-skip">건너뛰고 바로 시작 ⏭</button>
    </div>
  </div>
</section>

<!-- 게임 화면 -->
<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-item hud-stage">
      <span class="hud-label">스테이지</span>
      <span id="hud-stage-val" class="hud-value">1 / 100</span>
    </div>
    <div class="hud-item hud-name">
      <span id="hud-theme-val" class="hud-value">화살표 길찾기</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">블록</span>
      <span id="hud-blocks-val" class="hud-value">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">실행</span>
      <span id="hud-runs-val" class="hud-value">0번</span>
    </div>
    <div class="hud-item hud-timer">
      <span class="hud-label">시간</span>
      <span id="hud-timer-val" class="hud-value">0.0초</span>
    </div>
    <div class="hud-item hud-score">
      <span class="hud-label">점수</span>
      <span id="hud-score-val" class="hud-value">0</span>
    </div>
    <button id="btn-quit" class="btn btn-ghost btn-small">← 나가기</button>
  </header>

  <div class="stage-progress-bar"><div id="stage-progress-fill" class="stage-progress-fill"></div></div>

  <div id="board-wrap" class="board-wrap">
    <div class="play-area">
      <div class="question-card">
        <div id="q-buddy" class="q-buddy">🐰</div>
        <div id="q-text" class="q-text">당근까지 가는 길을 코딩해요!</div>
        <button id="btn-speak" class="btn-round" type="button" title="문제 듣기">🔊</button>
      </div>

      <div class="play-row">
        <div class="board-box">
          <div id="board" class="board"></div>
        </div>

        <div class="code-box">
          <div class="code-head">
            <span class="code-title">📝 내 코드</span>
            <span id="code-limit" class="code-limit"></span>
          </div>
          <div id="program" class="program"></div>
          <div id="palette" class="palette"></div>
          <div class="code-tools">
            <button id="btn-del" class="btn-tool" type="button" title="하나 지우기">⌫ 지우기</button>
            <button id="btn-clear" class="btn-tool" type="button" title="모두 지우기">🗑️ 모두</button>
          </div>
          <button id="btn-run" class="btn btn-primary btn-huge btn-run" type="button">▶ 실행</button>
        </div>
      </div>

      <div id="feedback" class="feedback"></div>
    </div>

    <div id="completion-modal" class="completion-modal">
      <div class="completion-card">
        <div id="completion-success" class="completion-variant">
          <div class="completion-emoji">🎉</div>
          <div class="completion-title">스테이지 클리어!</div>
          <div id="completion-stars" class="completion-stars"></div>
          <div id="completion-percent" class="completion-percent">0% 완성</div>
          <div id="completion-detail" class="completion-sub"></div>
          <div id="completion-score" class="completion-scoregain">+0점</div>
          <div class="completion-buttons">
            <button id="btn-completion-next" class="btn btn-primary btn-huge">다음 스테이지</button>
            <button id="btn-completion-retry" class="btn btn-ghost">🔁 다시 하기</button>
            <button id="btn-completion-rank" class="btn btn-ghost">🏆 이 스테이지 랭킹</button>
            <button id="btn-completion-list" class="btn btn-ghost">스테이지 선택</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="screen-result" class="screen">
  <div class="card">
    <div class="result-emoji">🏆</div>
    <h2>다 완성했어요!</h2>
    <div class="result-score">총 점수 <span id="result-total-score">0</span>점</div>
    <table class="result-table" id="result-table"></table>
    <div class="result-buttons">
      <button id="btn-retry" class="btn btn-primary btn-huge">스테이지 더 고르기</button>
      <button id="btn-to-title" class="btn btn-ghost">처음으로</button>
    </div>
  </div>
</section>

<!-- 랭킹 모달: 화면 어디서든 열 수 있도록 body 바로 아래에 둔다 -->
<div id="ranking-modal" class="ranking-modal">
  <div class="ranking-card">
    <div class="ranking-title">🏆 랭킹 <span id="ranking-stage-label" class="diff-tag"></span></div>
    <ol id="ranking-list" class="ranking-list"></ol>
    <div id="ranking-empty" class="ranking-empty">아직 기록이 없어요. 첫 번째 주인공이 되어보세요!</div>
    <button id="btn-ranking-close" class="btn btn-primary">닫기</button>
  </div>
</div>

<script src="coding-data.js"></script>
<script src="game.js"></script>
</body>
</html>
