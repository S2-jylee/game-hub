<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>틀린그림 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="guidebook.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="sc-rays"></div>
  <span class="sc-rise sc-bubble" style="left:4%;--s:20px;animation-duration:12s;animation-delay:-3s"></span>
  <span class="sc-rise sc-bubble" style="left:14%;--s:12px;animation-duration:9s;animation-delay:-6s"></span>
  <span class="sc-rise sc-bubble" style="left:84%;--s:24px;animation-duration:14s;animation-delay:-1s"></span>
  <span class="sc-rise sc-bubble" style="left:95%;--s:14px;animation-duration:10s;animation-delay:-8s"></span>
  <span class="sc-rise sc-bubble" style="left:50%;--s:10px;animation-duration:11s;animation-delay:-5s"></span>
  <span class="sc-fish" style="top:16%;animation-duration:30s;animation-delay:-5s">🐠</span>
  <span class="sc-fish" style="top:52%;animation-duration:38s;animation-delay:-22s">🐟</span>
  <span class="sc-fish sc-left" style="top:32%;animation-duration:34s;animation-delay:-12s">🐡</span>
  <svg class="sc-bottom" viewBox="0 0 1200 200" preserveAspectRatio="none">
    <path d="M0 150 Q300 115 600 145 T1200 140 V200 H0Z" fill="#ffe7b3"/>
    <path d="M0 175 Q350 150 700 172 T1200 168 V200 H0Z" fill="#ffd98a"/>
  </svg>
  <div class="sc-ground"><span>🌿</span><span>🐚</span><span>🪸</span><span>⭐</span><span>🌿</span><span>🐚</span></div>
</div>

<!-- 타이틀 화면 -->
<section id="screen-title" class="screen active">
  <div class="title-card">
    <div class="title-shapes" aria-hidden="true">
      <span class="ts ts1">🔍</span>
      <span class="ts ts2">👀</span>
      <span class="ts ts3">✏️</span>
      <span class="ts ts4">✨</span>
    </div>
    <h1>틀린그림 찾기</h1>
    <p class="subtitle">왼쪽과 오른쪽, 다른 곳을 모두 찾아보세요!</p>
    <button id="btn-start" class="btn btn-primary btn-huge">시작하기</button>
  </div>
</section>


<!-- 게임 화면 -->
<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-item hud-round">
      <span class="hud-label">라운드</span>
      <span id="hud-round-val" class="hud-value">1</span>
    </div>
    <div class="hud-item hud-hearts">
      <span class="hud-label">에너지</span>
      <span id="hud-hearts-val" class="hud-value hearts-row"></span>
    </div>
    <div class="hud-item hud-progress">
      <span class="hud-label">찾은 개수</span>
      <span id="hud-progress-val" class="hud-value">0 / 5</span>
    </div>
    <button id="btn-answer" class="btn btn-answer" type="button">🔒 정답보기</button>
    <button id="btn-hint" class="btn btn-hint" type="button">💡 힌트 <span id="hint-count">3</span></button>
    <button id="btn-quit" class="btn btn-ghost btn-small">← 나가기</button>
  </header>

  <div class="fuse-hud">
    <div class="fuse-track">
      <div id="fuse-burnt" class="fuse-burnt"></div>
      <div id="fuse-spark" class="fuse-spark">🔥</div>
    </div>
    <div id="fuse-bomb" class="fuse-bomb">💣</div>
    <span id="fuse-time" class="fuse-time">2:00</span>
  </div>

  <div class="stage-title"><span id="stage-emoji">🛝</span> <span id="stage-name">신나는 놀이터</span></div>

  <div class="board-wrap">
    <div class="diff-board">
      <div class="diff-panel" id="panel-left" data-side="left">
        <svg id="svg-left" viewBox="0 0 480 480" class="diff-svg" preserveAspectRatio="xMidYMid slice"><g id="g-left"></g></svg>
        <svg id="overlay-left" viewBox="0 0 480 480" class="diff-overlay"></svg>
      </div>
      <div class="diff-panel" id="panel-right" data-side="right">
        <svg id="svg-right" viewBox="0 0 480 480" class="diff-svg" preserveAspectRatio="xMidYMid slice"><g id="g-right"></g></svg>
        <svg id="overlay-right" viewBox="0 0 480 480" class="diff-overlay"></svg>
      </div>
    </div>
    <div id="round-toast" class="round-toast">🎉 정답! 모두 찾았어요! (+15초)</div>
    <div id="explosion-flash" class="explosion-flash"></div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="screen-result" class="screen">
  <div class="card">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <h2 id="result-title">게임 종료!</h2>
    <p id="result-reason" class="result-reason"></p>
    <div class="completion-stars" id="result-stars"></div>
    <div class="result-score">클리어한 라운드 <span id="result-rounds">0</span>개</div>
    <div class="result-sub">실수 <span id="result-mistakes">0</span>번 · 사용한 힌트 <span id="result-hints">0</span>개</div>
    <div class="result-buttons">
      <button id="btn-retry" class="btn btn-primary btn-huge">다시 하기</button>
      <button id="btn-to-title" class="btn btn-ghost">처음으로</button>
    </div>
  </div>
</section>

<!-- 보호자 확인 / 비밀번호 모달 -->
<div id="gate-modal" class="gate-modal">
  <div class="gate-card">
    <button type="button" id="gate-close" class="gate-close" aria-label="닫기">✕</button>
    <div id="gate-body"></div>
  </div>
</div>

<!-- 정답 표시중 배너 -->
<div id="answer-banner" class="answer-banner">
  <span>🔓 정답 위치가 표시되고 있어요!</span>
  <button type="button" id="btn-hide-answer" class="btn btn-primary btn-small">닫기</button>
</div>

<script src="guidebook.js"></script>
<script src="levels-data.js"></script>
<script src="game.js"></script>
</body>
</html>
