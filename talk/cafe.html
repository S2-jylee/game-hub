<!DOCTYPE html>

<link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="manifest" href="../manifest.webmanifest">
<title>주문받아 서빙하기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../spelling/style.css">

<style>
  .cafe-counter { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px;
    background: linear-gradient(#fff7ed, #ffedd5); border-radius: 24px; padding: 12px 12px 14px; box-shadow: inset 0 -10px 0 #fdba74; }
  .cafe-guest { font-size: 4rem; line-height: 1; transition: transform 0.3s ease; }
  .cafe-guest.happy { animation: guestHop 0.6s ease; }
  .cafe-guest.sad { animation: guestShake 0.45s ease; }
  @keyframes guestHop { 40% { transform: translateY(-16px) scale(1.08); } }
  @keyframes guestShake { 25%, 75% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
  .cafe-name { font-size: 0.8rem; font-weight: 800; color: #9a3412; }
  .cafe-bubble { position: relative; width: 100%; }
  .cafe-hidden-text { color: var(--text-soft) !important; font-family: "Pretendard", sans-serif !important; font-size: 0.9rem !important; }
  /* 주문 글은 처음에 가려져 있어요. 💡 를 누르면 보여요 */
  .cafe-tip { width: 100%; text-align: center; font-size: 0.8rem; font-weight: 700; color: #9a3412; line-height: 1.4; word-break: keep-all; }
  .cafe-bulb { flex: none; width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; margin-left: 6px;
    background: #fef3c7; font-size: 1.2rem; box-shadow: 0 2px 6px rgba(36, 27, 58, 0.1); }
  .cafe-bulb:active { transform: scale(0.92); }
  .cafe-bulb.used { background: #fde68a; }
  @media (max-width: 560px) { .cafe-bulb { width: 38px; height: 38px; font-size: 1.05rem; } .cafe-tip { font-size: 0.72rem; } }
  /* 담는 칸: 누른 메뉴가 가운데 정렬로 쌓여요 (칸을 누르면 빼요) */
  .cafe-box { flex: none; min-height: 64px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 8px;
    padding: 10px; border: 3px dashed #e7d5c3; border-radius: 20px; background: #fffaf3; }
  .cafe-box.ok { border-style: solid; border-color: #22c55e; background: #f0fdf4; }
  .cafe-box.no { border-style: solid; border-color: #ef4444; background: #fef2f2; animation: guestShake 0.4s ease; }
  .cafe-empty { font-size: 0.9rem; color: var(--text-soft); }
  .cafe-chip { border: 2px solid #fdba74; border-radius: 12px; background: #fff; padding: 6px 12px; cursor: pointer;
    font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; font-size: 1rem; color: #7c2d12; animation: chipIn 0.18s ease; }
  .cafe-chip::after { content: " ×"; color: #c2410c; opacity: 0.6; }
  @keyframes chipIn { from { transform: scale(0.6); opacity: 0; } }
  /* 메뉴 버튼 4개: PC 한 줄에 4개 · 휴대폰 2개씩 */
  .cafe-menu { flex: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .cafe-item { border: 3px solid #e7d5c3; border-radius: 18px; background: #fff; cursor: pointer; min-height: 64px; padding: 8px 6px;
    font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; font-size: 1.05rem; line-height: 1.2; color: #3b2a63;
    box-shadow: 0 5px 0 #e7d5c3; transition: transform 0.1s; word-break: keep-all; }
  .cafe-item:active { transform: translateY(3px); box-shadow: 0 2px 0 #e7d5c3; }
  .cafe-item .ci-num { display: block; font-size: 0.75rem; color: #c2410c; margin-bottom: 2px; }
  .cafe-actions { flex: none; display: flex; gap: 10px; justify-content: center; }
  .cafe-actions button { border: none; border-radius: 999px; padding: 12px 22px; font-family: inherit; font-weight: 800; font-size: 1.05rem; cursor: pointer; }
  .cafe-clear { background: #f4eefd; color: #4b3a75; }
  .cafe-ok { min-width: 140px; color: #fff; background: linear-gradient(135deg, #f97316, #db2777); box-shadow: 0 4px 0 #be185d; }
  .cafe-ok:active { transform: translateY(2px); box-shadow: 0 2px 0 #be185d; }
  .cafe-coin { position: fixed; z-index: 70; font-size: 1.8rem; pointer-events: none; animation: coinFly 0.9s ease forwards; }
  @keyframes coinFly { to { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; } }
  @media (min-width: 561px) {
    .cafe-item:hover { transform: translateY(-3px); }
    .cafe-box { min-height: 76px; }
    .cafe-chip { font-size: 1.15rem; padding: 8px 14px; }
  }
  @media (max-width: 560px) {
    .cafe-guest { font-size: 3rem; }
    .cafe-menu { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .cafe-item { min-height: 54px; font-size: 0.95rem; border-radius: 14px; }
    .cafe-chip { font-size: 0.9rem; padding: 5px 10px; }
    .cafe-actions button { padding: 10px 18px; font-size: 1rem; }
  }
</style>
</head>
<body>
<script src="../spelling/guidebook.js"></script>
<script src="talk-common.js"></script>
<script>
(function () {
  "use strict";
  // ---- 주문을 조합으로 만들어요: 메뉴 × 개수 × 크기 × 곁들임/빼기 × 말하는 방식 → 매번 다른 주문 ----
  // 재료(곁들이거나 빼 달라고 할 수 있는 것): [그림, 영어]
  var T = {
    cheese: ["🧀", "cheese"], onion: ["🧅", "onions"], pickle: ["🥒", "pickles"], tomato: ["🍅", "tomatoes"],
    mushroom: ["🍄", "mushrooms"], olive: ["🫒", "olives"], ketchup: ["🍅", "ketchup"], ice: ["🧊", "ice"],
    sugar: ["🍬", "sugar"], honey: ["🍯", "honey"], butter: ["🧈", "butter"], jam: ["🍓", "strawberry jam"],
    bacon: ["🥓", "bacon"], milk: ["🥛", "milk"], choco: ["🍫", "chocolate sauce"], cream: ["🧀", "cream cheese"],
    lemon: ["🍋", "lemon"], egg: ["🥚", "an egg"], cucumber: ["🥒", "cucumbers"], cherry: ["🍒", "a cherry on top"]
  };
  // 메뉴: [그림, 한 개, 여러 개, 종류(food/drink), 옵션]
  //  unit: 셀 때 쓰는 말 ["glass", "glasses", "milk"] → a glass of milk / two glasses of milk
  //  size: 작은/큰 사이즈가 있는 음료 · no: 빼 달라고 할 수 있는 재료 · add: 곁들여 달라고 할 수 있는 것
  var M = {
    donut: ["🍩", "donut", "donuts", "food", { add: ["choco"] }],
    bagel: ["🥯", "bagel", "bagels", "food", { add: ["cream", "butter", "jam"] }],
    cookie: ["🍪", "cookie", "cookies", "food", {}],
    cupcake: ["🧁", "cupcake", "cupcakes", "food", {}],
    croissant: ["🥐", "croissant", "croissants", "food", { add: ["butter", "jam"] }],
    pretzel: ["🥨", "pretzel", "pretzels", "food", {}],
    cake: ["🍰", "", "", "food", { unit: ["piece", "pieces", "cake"] }],
    pie: ["🥧", "", "", "food", { unit: ["piece", "pieces", "apple pie"] }],
    icecream: ["🍦", "ice cream", "ice creams", "food", { add: ["choco", "cherry"] }],
    pizza: ["🍕", "pizza", "pizzas", "food", { no: ["mushroom", "olive", "onion"], add: ["bacon"] }],
    burger: ["🍔", "burger", "burgers", "food", { no: ["cheese", "onion", "pickle", "tomato"], add: ["bacon", "cheese"] }],
    hotdog: ["🌭", "hot dog", "hot dogs", "food", { no: ["ketchup", "onion"] }],
    sandwich: ["🥪", "sandwich", "sandwiches", "food", { no: ["cheese", "tomato", "pickle"] }],
    taco: ["🌮", "taco", "tacos", "food", { no: ["onion", "tomato", "cheese"] }],
    burrito: ["🌯", "burrito", "burritos", "food", { no: ["onion", "cheese"] }],
    salad: ["🥗", "salad", "salads", "food", { no: ["tomato", "onion", "cucumber"], add: ["egg"] }],
    soup: ["🍲", "", "", "food", { unit: ["bowl", "bowls", "soup"] }],
    rice: ["🍚", "", "", "food", { unit: ["bowl", "bowls", "rice"], add: ["egg"] }],
    spaghetti: ["🍝", "", "", "food", { unit: ["plate", "plates", "spaghetti"], no: ["mushroom", "onion"] }],
    dumpling: ["🥟", "", "", "food", { unit: ["plate", "plates", "dumplings"] }],
    sushi: ["🍣", "", "", "food", { unit: ["plate", "plates", "sushi"] }],
    pancake: ["🥞", "", "", "food", { unit: ["stack", "stacks", "pancakes"], add: ["honey", "butter", "jam"] }],
    waffle: ["🧇", "waffle", "waffles", "food", { add: ["honey", "jam", "choco"] }],
    fries: ["🍟", "", "", "food", { unit: ["order", "orders", "fries"], add: ["ketchup"] }],
    apple: ["🍎", "apple", "apples", "food", {}],
    banana: ["🍌", "banana", "bananas", "food", {}],
    milk: ["🥛", "", "", "drink", { unit: ["glass", "glasses", "milk"] }],
    water: ["💧", "", "", "drink", { unit: ["glass", "glasses", "water"], no: ["ice"], add: ["lemon"] }],
    tea: ["🍵", "", "", "drink", { unit: ["cup", "cups", "tea"], no: ["sugar"], add: ["honey", "lemon", "milk"] }],
    coffee: ["☕", "", "", "drink", { unit: ["cup", "cups", "coffee"], no: ["sugar"], add: ["milk"] }],
    cocoa: ["🍫☕", "", "", "drink", { unit: ["cup", "cups", "hot chocolate"] }],
    oj: ["🍊🧃", "orange juice", "orange juices", "drink", { size: 1, no: ["ice"] }],
    aj: ["🍎🧃", "apple juice", "apple juices", "drink", { size: 1, no: ["ice"] }],
    cola: ["🥤", "cola", "colas", "drink", { size: 1, no: ["ice"] }],
    lemonade: ["🍋🥤", "lemonade", "lemonades", "drink", { size: 1, no: ["ice"] }],
    bubbletea: ["🧋", "bubble tea", "bubble teas", "drink", { size: 1, no: ["ice", "sugar"] }],
    iced: ["🧊☕", "iced americano", "iced americanos", "drink", { size: 1 }]
  };
  var KEYS = Object.keys(M);
  var FOODS = KEYS.filter(function (k) { return M[k][3] === "food"; });
  var DRINKS = KEYS.filter(function (k) { return M[k][3] === "drink"; });
  var NUM = ["", "one", "two", "three"];
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function chance(p) { return Math.random() < p; }
  function an(w) { return (/^[aeiou]/i.test(w) ? "an " : "a ") + w; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function opt(k) { return M[k][4]; }

  // 주문 한 가지: { k: 메뉴, n: 개수, size: "small"|"large"|"", add: 곁들임, no: 빼기 }
  function itemKey(it) { return [it.k, it.n, it.size, it.add, it.no].join("/"); }
  function orderKey(o) { return o.map(itemKey).sort().join("|"); }
  function itemPhrase(it) {
    var m = M[it.k], o = opt(it.k), s;
    var size = it.size ? it.size + " " : "";
    if (o.unit) s = (it.n === 1 ? an(o.unit[0]) : NUM[it.n] + " " + o.unit[1]) + " of " + o.unit[2];
    else s = it.n === 1 ? an(size + m[1]) : NUM[it.n] + " " + size + m[2];
    if (it.add) s += " with " + T[it.add][1];
    if (it.no) s += pick([" without " + T[it.no][1], " with no " + T[it.no][1]]);
    return s;
  }
  function joinAnd(parts) {
    if (parts.length === 1) return parts[0];
    if (parts.length === 2) return parts[0] + " and " + parts[1];
    return parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
  }
  var SAY = {
    easy: ["Can I have {o}, please?", "I'd like {o}.", "{O}, please.", "Can I get {o}?", "I want {o}, please.", "Hi! {O}, please."],
    normal: ["Can I have {o}, please?", "I'd like {o}, please.", "Could I get {o}?", "May I have {o}?", "{O}, please. Thank you!", "Hello! I'll have {o}."],
    hard: ["Would you mind bringing me {o}?", "Could we have {o}, please?", "I'll have {o}, thanks.", "Would it be possible to get {o}?", "Hi there! Could I please get {o}?"]
  };
  var WHO = ["sister", "brother", "mom", "dad", "friend", "grandma"];
  function orderText(o, lvId) {
    // 어려움: 가끔 "나는 ~, 우리 언니는 ~" 처럼 두 사람 몫으로 나눠서 말해요
    if (lvId === "hard" && o.length >= 2 && chance(0.4)) {
      var mine = o.slice(0, o.length - 1).map(itemPhrase), theirs = itemPhrase(o[o.length - 1]);
      return "I'll have " + joinAnd(mine) + ", and my " + pick(WHO) + " wants " + theirs + ".";
    }
    var body = joinAnd(o.map(itemPhrase));
    return pick(SAY[lvId]).replace("{o}", body).replace("{O}", cap(body));
  }

  function makeItem(k, lvId) {
    var o = opt(k), it = { k: k, n: 1, size: "", add: "", no: "" };
    it.n = 1 + Math.floor(Math.random() * (lvId === "easy" ? 3 : 2));
    if (lvId !== "easy" && o.size && chance(0.6)) it.size = pick(["small", "large"]);
    if (lvId === "normal" && o.add && chance(0.35)) it.add = pick(o.add);
    if (lvId === "hard") {
      if (o.no && chance(0.55)) it.no = pick(o.no);
      else if (o.add && chance(0.4)) it.add = pick(o.add);
    }
    return it;
  }
  function makeOrder(lvId) {
    var ks;
    if (lvId === "easy") ks = [pick(KEYS)];
    else if (lvId === "normal") ks = chance(0.75) ? [pick(FOODS), pick(DRINKS)] : Talk.shuffle(FOODS.slice()).slice(0, 2);
    else ks = chance(0.5) ? Talk.shuffle(FOODS.slice()).slice(0, 2).concat([pick(DRINKS)]) : [pick(FOODS), pick(DRINKS)];
    var order = ks.map(function (k) { return makeItem(k, lvId); });
    // 어려움인데 빼기·크기처럼 '잘 들어야 하는 말'이 하나도 없으면 하나 넣어요
    if (lvId === "hard" && !order.some(function (it) { return it.no || it.size; })) {
      var c = order.filter(function (it) { return opt(it.k).no; })[0];
      if (c) { c.no = pick(opt(c.k).no); c.add = ""; }
    }
    return order;
  }
  function makeQuestion(lvId) {
    var order = makeOrder(lvId);
    return { text: orderText(order, lvId), right: order };
  }
  var GUESTS = [["🐻", "Bear"], ["🐰", "Bunny"], ["🦊", "Fox"], ["🐼", "Panda"], ["🐨", "Koala"], ["🐯", "Tiger"], ["🐷", "Piggy"], ["🐱", "Kitty"], ["🦁", "Lion"], ["🐸", "Froggy"],
    ["🐵", "Monkey"], ["🐧", "Penguin"], ["🐮", "Cow"], ["🐹", "Hammy"], ["🦉", "Owl"], ["🐙", "Octopus"], ["🦄", "Unicorn"], ["🐲", "Dragon"], ["🦒", "Giraffe"], ["🐘", "Ellie"]];

  Talk.mount({
    id: "talk_cafe", title: "주문받아 서빙하기", unit: "손님", total: 10, goLabel: "오픈 ▶", startLabel: "가게 오픈! ☕",
    levels: [
      { id: "easy", name: "쉬움", emoji: "🐣", desc: "한 가지 · 개수", bg: "#ecfccb", c: "#65a30d" },
      { id: "normal", name: "보통", emoji: "🐥", desc: "두 가지 · 크기 · 곁들임", bg: "#dbeafe", c: "#2563eb" },
      { id: "hard", name: "어려움", emoji: "🦅", desc: "정중한 부탁 · 빼 주세요", bg: "#fce7f3", c: "#db2777" }
    ],
    guide: function (lv) {
      return [
        { icon: "🎧", title: "귀로 듣고 풀어요", text: "<b>소리를 켜요!</b> 동물 손님이 영어로 주문해요. 주문 글은 <b>가려져 있어요</b>.<br>🔊 를 누르면 다시 듣고, 너무 어려우면 💡 를 눌러 주문 글을 봐요." },
        { icon: "🍽️", title: "메뉴를 담아요", text: "아래 <b>영어 메뉴 버튼 4개</b> 중에서 주문한 메뉴를 <b>개수만큼</b> 눌러요. 예) two pizzas → <b>pizza</b> 를 두 번! 담은 메뉴를 누르면 빠져요." },
        { icon: "✅", title: "확인!", text: "다 담았으면 <b>확인</b>을 눌러요. <b>small / large</b>(크기), <b>with</b>(곁들임), <b>without / no</b>(빼 주세요)도 버튼 이름을 잘 봐요." },
        { icon: "🪙", title: "코인 받기", text: "맞으면 손님이 기뻐하며 <b>코인</b>을 줘요. 틀리면 하트가 하나 줄어요." },
        { icon: "🏆", title: "손님 10명", text: "손님 <b>10명</b>에게 서빙하면 성공!" }
      ];
    },
    create: function (stage, lv) {
      // 매번 새로 조합한 주문 10개 (같은 주문이 겹치지 않게)
      var list = [], seen = {};
      for (var q = 0; list.length < 10 && q < 200; q++) {
        var nq = makeQuestion(lv.id);
        if (seen[nq.text]) continue;
        seen[nq.text] = 1; list.push(nq);
      }
      var guests = Talk.shuffle(GUESTS.slice());
      stage.innerHTML =
        '<div class="cafe-counter"><div class="cafe-guest" id="cf-guest">🐻</div><div class="cafe-name" id="cf-name"></div>' +
        '<div class="cafe-tip">🔊 소리를 켜고 손님의 주문을 귀로 듣고 풀어요. 다시 들으려면 🔊, 그래도 어려우면 💡 를 눌러 주문 글을 봐요.</div>' +
        '<div class="talk-bubble cafe-bubble" id="cf-bubble"><div class="tb-main"><div class="tb-text" id="cf-text"></div></div></div></div>' +
        '<div class="talk-msg" id="talk-msg"></div>' +
        '<div class="cafe-box" id="cf-box"></div>' +
        '<div class="cafe-menu" id="cf-menu"></div>' +
        '<div class="cafe-actions"><button type="button" class="cafe-clear" id="cf-clear">↺ 다시 담기</button><button type="button" class="cafe-ok" id="cf-ok">확인</button></div>';
      var cur = null, lock = false, timer = 0;
      Talk.$("#cf-bubble").appendChild(Talk.sayButton(function () { return cur ? cur.text : ""; }));
      // 💡 주문 글 보기 (한 번 더 누르면 다시 가려요)
      var bulb = document.createElement("button");
      bulb.type = "button"; bulb.className = "cafe-bulb"; bulb.textContent = "💡"; bulb.title = "주문 글 보기";
      bulb.addEventListener("click", function () {
        if (!cur || Talk.paused()) return;
        var text = Talk.$("#cf-text"), shown = !text.classList.contains("cafe-hidden-text");
        text.textContent = shown ? "🎧 주문을 잘 듣고 담아요!" : cur.text;
        text.classList.toggle("cafe-hidden-text", shown);
        bulb.classList.toggle("used", !shown);
        bulb.title = shown ? "주문 글 보기" : "주문 글 가리기";
      });
      Talk.$("#cf-bubble").appendChild(bulb);
      // 메뉴 버튼 하나 = 메뉴 + 크기 + 곁들임/빼기 (개수는 누르는 횟수로)
      function variant(it) { return { k: it.k, size: it.size, add: it.add, no: it.no }; }
      function vKey(v) { return [v.k, v.size, v.add, v.no].join("/"); }
      function vLabel(v) {
        var m = M[v.k], o = opt(v.k), noun = o.unit ? o.unit[2] : m[1];
        if (v.size) noun = v.size + " " + noun;
        if (v.add) noun += " with " + T[v.add][1].replace(/^an? /, "");
        if (v.no) noun += " without " + T[v.no][1];
        return noun;
      }
      // 보기 4개: 주문한 메뉴 + 다른 메뉴 (보통·어려움은 크기·곁들임·빼기만 다른 헷갈리는 보기도 하나)
      function choices(order) {
        var right = order.map(variant), keys = right.map(vKey), out = right.slice(), tricky = [];
        if (lv.id !== "easy") right.forEach(function (v) {
          var o = opt(v.k);
          if (v.size) tricky.push(Object.assign({}, v, { size: v.size === "small" ? "large" : "small" }));
          if (v.no) tricky.push(Object.assign({}, v, { no: "" }));
          if (v.add) tricky.push(Object.assign({}, v, { add: "" }));
          if (lv.id === "hard" && o.no && !v.no) tricky.push(Object.assign({}, v, { no: pick(o.no), add: "" }));
        });
        var others = Talk.shuffle(KEYS.filter(function (k) { return !right.some(function (v) { return v.k === k; }); }))
          .map(function (k) { return { k: k, size: "", add: "", no: "" }; });
        Talk.shuffle(tricky).slice(0, 1).concat(others).forEach(function (v) {
          if (out.length < 4 && keys.indexOf(vKey(v)) < 0) { keys.push(vKey(v)); out.push(v); }
        });
        return Talk.shuffle(out);
      }
      function coin(from) {
        var box = Talk.$("#hud-score-box").getBoundingClientRect();
        for (var i = 0; i < 3; i++) {
          var c = document.createElement("div");
          c.className = "cafe-coin"; c.textContent = "🪙";
          c.style.left = from.left + from.width / 2 - 14 + "px"; c.style.top = from.top + "px";
          c.style.setProperty("--dx", box.left - from.left - from.width / 2 + 20 + "px");
          c.style.setProperty("--dy", box.top - from.top + "px");
          c.style.animationDelay = i * 0.08 + "s";
          document.body.appendChild(c);
          (function (el) { setTimeout(function () { el.remove(); }, 1200); })(c);
        }
        Talk.sfx.coin();
      }
      var picked = [], opts = [], MAX = 9;
      var boxEl = Talk.$("#cf-box"), menuEl = Talk.$("#cf-menu");
      function renderBox() {
        boxEl.className = "cafe-box";
        boxEl.innerHTML = "";
        if (!picked.length) { boxEl.innerHTML = '<span class="cafe-empty">메뉴 버튼을 눌러 주문을 담아요</span>'; return; }
        picked.forEach(function (v, idx) {
          var c = document.createElement("button");
          c.type = "button"; c.className = "cafe-chip"; c.textContent = vLabel(v); c.title = "빼기";
          c.addEventListener("click", function () { if (lock || Talk.paused()) return; picked.splice(idx, 1); renderBox(); });
          boxEl.appendChild(c);
        });
      }
      function add(i) {
        if (lock || Talk.paused() || !opts[i]) return;
        if (picked.length >= MAX) { Talk.msg("너무 많이 담았어요! 담은 메뉴를 눌러 빼요"); return; }
        picked.push(opts[i]); renderBox(); Talk.sfx.pop && Talk.sfx.pop();
      }
      function clearBox() { if (lock || Talk.paused()) return; picked = []; renderBox(); }
      // 맞았는지: 메뉴마다 담은 개수가 주문 개수와 똑같아야 해요
      function check() {
        if (lock || Talk.paused()) return;
        if (!picked.length) { Talk.msg("먼저 메뉴 버튼을 눌러 담아요!"); return; }
        var want = {}, got = {};
        cur.right.forEach(function (it) { want[vKey(it)] = (want[vKey(it)] || 0) + it.n; });
        picked.forEach(function (v) { got[vKey(v)] = (got[vKey(v)] || 0) + 1; });
        var extra = Object.keys(got).some(function (k) { return !want[k]; });
        var missing = Object.keys(want).some(function (k) { return !got[k]; });
        var ok = !extra && !missing && Object.keys(want).every(function (k) { return want[k] === got[k]; });
        var r = Talk.$("#cf-ok").getBoundingClientRect(), ge = Talk.$("#cf-guest");
        if (ok) {
          lock = true;
          boxEl.classList.add("ok");
          ge.classList.add("happy");
          Talk.good(r.left + r.width / 2, r.top);
          coin(boxEl.getBoundingClientRect());
          Talk.msg("😋 Thank you! 손님이 기뻐해요!");
          Talk.speak("Thank you!");
          timer = setTimeout(next, 1500);
        } else {
          boxEl.classList.remove("no"); void boxEl.offsetWidth; boxEl.classList.add("no");
          ge.classList.remove("sad"); void ge.offsetWidth; ge.classList.add("sad");
          Talk.msg(extra ? "앗, 주문에 없는 메뉴가 있어요! 눌러서 빼요" : missing ? "앗, 빠진 메뉴가 있어요! 다시 잘 들어 봐요 🔊" : "앗, 개수가 달라요! 몇 개인지 다시 세어 봐요");
          if (!Talk.bad()) lock = true;
          else setTimeout(function () { Talk.speak(cur.text); }, 500);
        }
      }
      Talk.$("#cf-clear").addEventListener("click", clearBox);
      Talk.$("#cf-ok").addEventListener("click", check);
      // 키보드: 1~4 담기 · Backspace 하나 빼기 · Enter 확인
      function onKey(e) {
        if (stage.offsetParent === null || document.querySelector(".gb-overlay.show")) return;
        if (/^[1-4]$/.test(e.key)) { e.preventDefault(); add(+e.key - 1); }
        else if (e.key === "Backspace") { e.preventDefault(); if (!lock && !Talk.paused() && picked.length) { picked.pop(); renderBox(); } }
        else if (e.key === "Enter") { e.preventDefault(); check(); }
      }
      document.addEventListener("keydown", onKey);
      function ask(i) {
        cur = list[i]; lock = false;
        var g = guests[i % guests.length];
        var ge = Talk.$("#cf-guest");
        ge.textContent = g[0]; ge.className = "cafe-guest";
        Talk.$("#cf-name").textContent = g[1] + " 손님";
        // 주문 글은 가려 두고, 💡 를 누르면 보여요 (모든 난이도)
        var text = Talk.$("#cf-text");
        text.textContent = "🎧 주문을 잘 듣고 담아요!";
        text.classList.add("cafe-hidden-text");
        bulb.classList.remove("used");
        bulb.title = "주문 글 보기";
        var b = Talk.$("#cf-bubble"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
        Talk.msg("주문한 메뉴를 개수만큼 담고 확인!");
        Talk.speak(cur.text);
        picked = []; renderBox();
        opts = choices(cur.right);
        menuEl.innerHTML = "";
        opts.forEach(function (v, idx) {
          var el = document.createElement("button");
          el.type = "button"; el.className = "cafe-item";
          el.innerHTML = '<span class="ci-num">' + (idx + 1) + "</span>" + Talk.esc(vLabel(v));
          el.addEventListener("click", function () { add(idx); });
          menuEl.appendChild(el);
        });
      }
      function next() { if (Talk.G.over) return; if (Talk.next()) ask(Talk.G.q); }
      return { begin: function () { ask(0); }, stop: function () { clearTimeout(timer); document.removeEventListener("keydown", onKey); } };
    }
  });
})();
</script>
