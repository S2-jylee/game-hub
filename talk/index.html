<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>영어 놀이 회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../spelling/style.css">
<style>
  /* 영어 놀이 고르기: 타자연습처럼 놀이 카드가 여러 개 */
  .play-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; width: min(860px, 92vw); margin: 8px auto 0; }
  .play-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none;
    border-radius: 26px; padding: 22px 14px 18px; color: #fff; background: var(--bg);
    box-shadow: 0 8px 20px rgba(36, 27, 58, 0.12); transition: transform 0.15s ease;
  }
  .play-card:hover { transform: translateY(-5px); }
  .play-card:active { transform: translateY(2px); }
  .play-card .pc-emoji {
    width: 86px; height: 86px; border-radius: 50%; background: rgba(255, 255, 255, 0.92);
    display: flex; align-items: center; justify-content: center; font-size: 2.8rem;
    animation: bob 3.2s ease-in-out infinite;
  }
  .play-card .pc-name { font-family: 'Pretendard', 'Gowun Dodum', sans-serif; font-weight: 800; font-size: 23px; margin-top: 4px; }
  .play-card .pc-desc { font-size: 17px; opacity: 0.95; text-align: center; }
  /* 휴대폰: 놀이 카드를 가로 2개씩 */
  @media (max-width: 560px) {
    .play-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; width: calc(100vw - 24px); }
    .play-card { padding: 14px 8px 12px; border-radius: 20px; gap: 4px; }
    .play-card .pc-emoji { width: 56px; height: 56px; font-size: 1.8rem; }
    .play-card .pc-name { font-size: 19px; text-align: center; }
    .play-card .pc-desc { font-size: 12px; }
  }
  .play-card:nth-child(3n+2) .pc-emoji { animation-delay: 0.5s; }
  .play-card:nth-child(3n) .pc-emoji { animation-delay: 1s; }
  .play-card.soon { background: #eceaf1; color: var(--text-soft); box-shadow: none; pointer-events: none; }
  .play-card.soon .pc-emoji { animation: none; filter: grayscale(0.4); }
  .english-title { text-align: center; }
  .english-title h1 { font-family: "CookieRun", "Jua", sans-serif; font-size: 2.6rem; margin: 6px 0 4px; color: var(--lime-dark); }
  #screen-menu { justify-content: flex-start; overflow-y: auto; padding: 14px 0 20px; }
  @media (max-width: 560px) { #screen-menu { padding-top: 12px; } }
  .english-title h1.game-title { margin: 0 0 12px; }
  /* 회화 놀이는 PC에서 한 줄에 3개씩 */
  @media (min-width: 561px) { .play-grid { grid-template-columns: repeat(3, 1fr); width: min(860px, 92vw); } }
  /* 🔑 숨은 놀이 열기 */
  .key-btn { position: fixed; top: 12px; right: 12px; z-index: 30; width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255, 255, 255, 0.85); box-shadow: 0 3px 10px rgba(36, 27, 58, 0.15); font-size: 1.35rem; }
  .key-btn:active { transform: scale(0.92); }
  .key-btn.open { background: #fde68a; }
  .play-card.ai-card { background: linear-gradient(135deg, #8b5cf6, #ec4899); display: none; }
  .play-card.ai-card.show { display: flex; animation: aiPop 0.5s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes aiPop { from { transform: scale(0.7); opacity: 0; } }
  .key-modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: rgba(36, 27, 58, 0.45); padding: 16px; }
  .key-modal.show { display: flex; }
  .key-card { width: min(340px, 100%); background: #fff; border-radius: 24px; padding: 22px 18px 16px; text-align: center; box-shadow: 0 16px 40px rgba(36, 27, 58, 0.25); }
  .key-card h2 { margin: 0 0 4px; font-family: "CookieRun", "Jua", sans-serif; color: #7c3aed; }
  .key-card p { margin: 0 0 12px; font-size: 0.85rem; color: var(--text-soft); }
  .key-card input { width: 100%; box-sizing: border-box; font-size: 1.3rem; text-align: center; letter-spacing: 4px; padding: 12px; border-radius: 14px; border: 2px solid #ddd6fe; outline: none; font-family: inherit; }
  .key-card input:focus { border-color: #8b5cf6; }
  .key-card .key-err { min-height: 1.3em; margin: 8px 0 4px; font-size: 0.85rem; font-weight: 700; color: #dc2626; }
  .key-card .key-row { display: flex; gap: 8px; justify-content: center; }
  .key-card button { border: none; border-radius: 14px; padding: 11px 18px; font-weight: 800; font-size: 1rem; cursor: pointer; font-family: inherit; }
  .key-card .key-ok { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: #fff; }
  .key-card .key-cancel { background: #f3f0fa; color: #6b5b95; }
  .key-card .key-shake { animation: keyShake 0.35s ease; }
  @keyframes keyShake { 25%, 75% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
</style>
<link rel="stylesheet" href="../shared/game-title.css">
<link rel="stylesheet" href="../shared/english-bg.css">
</head>
<body>


<section id="screen-menu" class="screen active">
  <div class="english-title">
    <h1 class="game-title">영어 놀이 회화</h1>
    <p class="subtitle">오늘은 어떤 영어로 말해 볼까요? 💬</p>
  </div>
  <div class="play-grid">
    <a class="play-card" href="pingpong.html" style="--bg:#3b82f6">
      <span class="pc-emoji">🏓</span>
      <span class="pc-name">핑퐁 대화 티키타카</span>
      <span class="pc-desc">친구 말에 가장 자연스러운 대답 레인으로 달려요!</span>
    </a>
    <a class="play-card" href="cafe.html" style="--bg:#f59e0b">
      <span class="pc-emoji">☕</span>
      <span class="pc-name">주문받아 서빙하기</span>
      <span class="pc-desc">손님 주문을 잘 듣고 맞는 쟁반을 톡!</span>
    </a>
    <a class="play-card" href="sentence.html" style="--bg:#14b8a6">
      <span class="pc-emoji">🧩</span>
      <span class="pc-name">문장 퍼즐 조립</span>
      <span class="pc-desc">퍼즐 조각을 끌어다 맞춰 통문장 완성!</span>
    </a>
    <a class="play-card" href="adventure.html" style="--bg:#ec4899">
      <span class="pc-emoji">🗺️</span>
      <span class="pc-name">어떻게 말할까?</span>
      <span class="pc-desc">교실 · 공항 · 놀이공원 등 20곳에서 대화로 도와줘요</span>
    </a>
    <a class="play-card ai-card" id="ai-card" href="ai.html">
      <span class="pc-emoji">🤖</span>
      <span class="pc-name">AI 스피킹하기</span>
      <span class="pc-desc">AI 친구가 내 주는 오늘의 상황극! 🎤 로 직접 말해요</span>
    </a>
  </div>
</section>

<button class="key-btn" id="key-btn" type="button" title="숨은 놀이 열기">🔑</button>
<div class="key-modal" id="key-modal">
  <div class="key-card" id="key-card">
    <h2>🔑 비밀번호</h2>
    <p id="key-desc">비밀번호를 넣으면 숨은 놀이가 나와요</p>
    <input id="key-input" type="password" autocomplete="off" inputmode="text">
    <div class="key-err" id="key-err"></div>
    <div class="key-row">
      <button class="key-cancel" id="key-cancel" type="button">닫기</button>
      <button class="key-ok" id="key-ok" type="button">열기</button>
    </div>
  </div>
</div>

<script src="ai-config.js"></script>
<script>
(function () {
  "use strict";
  var card = document.getElementById("ai-card"), btn = document.getElementById("key-btn");
  var modal = document.getElementById("key-modal"), input = document.getElementById("key-input");
  var err = document.getElementById("key-err"), ok = document.getElementById("key-ok"), box = document.getElementById("key-card");
  function saved() { try { return localStorage.getItem(TalkAI.PW_KEY) || ""; } catch (e) { return ""; } }
  function render() { var on = !!saved(); card.classList.toggle("show", on); btn.classList.toggle("open", on); }
  render();
  function close() { modal.classList.remove("show"); input.value = ""; err.textContent = ""; }
  btn.addEventListener("click", function () {
    if (saved()) {
      // 이미 열려 있으면: 다시 숨길지 물어봐요
      if (confirm("AI 스피킹하기를 다시 숨길까요?")) { try { localStorage.removeItem(TalkAI.PW_KEY); } catch (e) { /* ignore */ } render(); }
      return;
    }
    modal.classList.add("show");
    setTimeout(function () { input.focus(); }, 50);
  });
  document.getElementById("key-cancel").addEventListener("click", close);
  modal.addEventListener("click", function (e) { if (e.target === modal) close(); });
  function submit() {
    var pw = input.value.trim();
    if (!pw) return;
    ok.disabled = true; err.textContent = "확인하는 중…";
    TalkAI.call({ action: "verify", password: pw }).then(function (r) {
      ok.disabled = false;
      if (r.ok) {
        try { localStorage.setItem(TalkAI.PW_KEY, pw); } catch (e) { /* ignore */ }
        close(); render();
        card.scrollIntoView({ behavior: "smooth", block: "center" });
      } else {
        err.textContent = r.error === "wrong_password" ? "비밀번호가 달라요" : "연결이 안 돼요. 잠시 뒤에 다시 해 주세요";
        box.classList.remove("key-shake"); void box.offsetWidth; box.classList.add("key-shake");
        input.select();
      }
    });
  }
  ok.addEventListener("click", submit);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
})();
</script>

<script src="../shared/game-title.js"></script>
<script src="../shared/english-bg.js"></script>
</body>
</html>
