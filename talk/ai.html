<!DOCTYPE html>
<html lang="ko" data-tts>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>AI 스피킹하기</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../spelling/style.css">
<link rel="stylesheet" href="../shared/english-bg.css">
<style>
  #screen-ai { justify-content: flex-start; padding: 10px 0 0; overflow: hidden; }
  .ai-wrap { width: min(720px, calc(100vw - 20px)); flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; margin: 0 auto; }
  .ai-top { display: flex; align-items: center; gap: 8px; }
  .ai-top h1 { flex: 1; margin: 0; text-align: center; font-family: "CookieRun", "Jua", sans-serif; font-size: 1.5rem; color: #7c3aed; }
  .ai-top .spacer { width: 84px; }
  .ai-back { border: none; border-radius: 999px; padding: 8px 14px; background: rgba(255,255,255,.9); font-weight: 800; color: #6b5b95; cursor: pointer; font-family: inherit; box-shadow: 0 2px 8px rgba(36,27,58,.1); text-decoration: none; font-size: .9rem; }

  .scene-card { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 20px; padding: 10px 14px; box-shadow: 0 4px 14px rgba(36,27,58,.08); }
  .scene-card .sc-emoji { font-size: 2.4rem; line-height: 1; flex: none; }
  .scene-card .sc-title { font-family: "CookieRun", "Jua", sans-serif; font-size: 1.1rem; color: #7c3aed; }
  .scene-card .sc-text { font-size: .85rem; color: var(--text-dark); line-height: 1.35; }

  .chat { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 6px 2px 10px; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 18px; line-height: 1.32; position: relative; animation: msgIn .25s ease; }
  @keyframes msgIn { from { transform: translateY(6px); opacity: 0; } }
  .msg.ai { align-self: flex-start; background: #fff; border-bottom-left-radius: 5px; box-shadow: 0 3px 10px rgba(36,27,58,.07); }
  .msg.me { align-self: flex-end; background: #dcfce7; color: #14532d; border-bottom-right-radius: 5px; }
  .msg .en { font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; font-size: 1.05rem; color: #1d4ed8; }
  .msg.me .en { color: #166534; }
  .msg .ko { font-size: .8rem; color: var(--text-soft); margin-top: 3px; display: none; }
  .msg .ko.show { display: block; }
  .msg .tools { display: flex; gap: 6px; margin-top: 6px; }
  .mini { border: none; border-radius: 999px; padding: 4px 10px; font-size: .75rem; font-weight: 800; cursor: pointer; background: #eef2ff; color: #4338ca; font-family: inherit; }
  .msg .who { font-size: .72rem; font-weight: 800; color: #7c3aed; margin-bottom: 2px; }
  .fix { align-self: flex-end; max-width: 86%; background: #fff7ed; border: 2px dashed #fdba74; border-radius: 16px; padding: 7px 11px; font-size: .82rem; color: #9a3412; }
  .fix b { font-family: "Nunito", "Pretendard", sans-serif; font-size: .95rem; }
  .fix .fix-ko { margin: 4px 0 6px; font-size: .85rem; color: #7c2d12; line-height: 1.4; }
  .lv { font-size: .72rem; font-weight: 800; color: #7c3aed; background: #f1e9ff; border-radius: 999px; padding: 2px 8px; margin-left: 4px; vertical-align: middle; }
  .praise { align-self: flex-end; font-size: .8rem; font-weight: 800; color: #db2777; padding: 0 6px; }
  .typing { align-self: flex-start; background: #fff; border-radius: 18px; padding: 10px 14px; font-size: 1.2rem; letter-spacing: 3px; color: #a78bfa; }
  .typing span { animation: dot 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes dot { 50% { opacity: .2; } }

  .dock { flex: none; background: rgba(255,255,255,.92); border-radius: 22px 22px 0 0; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(36,27,58,.08); display: flex; flex-direction: column; gap: 8px; }
  /* 힌트: '힌트 보기'를 누르면 한글 / 영어 두 줄로 나와요 */
  .hint { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 1.2em; }
  .hint:empty { display: none; }
  .hint-btn { border: none; border-radius: 999px; padding: 6px 14px; font-size: .85rem; font-weight: 800; cursor: pointer; background: #fef3c7; color: #92400e; font-family: inherit; }
  .hint-box { flex: 1; display: flex; align-items: center; gap: 10px; background: #fffbeb; border-radius: 14px; padding: 7px 12px; }
  .hint-box .hb-ico { font-size: 1.2rem; flex: none; }
  .hint-box .hb-lines { flex: 1; min-width: 0; line-height: 1.35; }
  .hint-box .hb-ko { font-size: .85rem; color: var(--text-dark); font-weight: 700; }
  .hint-box .hb-en { font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; color: #7c3aed; font-size: 1rem; }
  .retry-tag { display: inline-block; font-size: .7rem; font-weight: 800; color: #b45309; background: #fef3c7; border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
  .brief { text-align: left; background: #f5f3ff; border-radius: 16px; padding: 12px 14px; margin: 8px 0 10px; font-size: .92rem; line-height: 1.6; color: var(--text-dark); white-space: pre-line; }
  .brief-play { margin: 0 auto 6px; display: inline-flex; align-items: center; gap: 6px; }
  .brief-play.on { animation: micPulse 1.2s ease-in-out infinite; }
  .brief-msg { font-size: .78rem; color: var(--text-soft); min-height: 1em; margin-bottom: 6px; }
  .wrap-h { text-align: left; font-weight: 800; color: #7c3aed; font-size: .9rem; margin: 10px 2px 4px; }
  .fixes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .fixrow { text-align: left; background: #fff7ed; border-radius: 12px; padding: 8px 10px; font-size: .82rem; color: #7c2d12; }
  .fixrow .said { text-decoration: line-through; opacity: .7; }
  .fixrow .better { font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; color: #c2410c; font-size: .95rem; }
  #wrap { max-height: 100%; overflow-y: auto; }
  .live { min-height: 1.4em; text-align: center; font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; color: #166534; font-size: 1rem; }
  .mic-row { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .mic-big { width: 78px; height: 78px; border-radius: 50%; border: none; cursor: pointer; font-size: 2rem; color: #fff;
    background: linear-gradient(135deg, #8b5cf6, #ec4899); box-shadow: 0 6px 0 rgba(124,58,237,.35); flex: none; }
  .mic-big:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(124,58,237,.35); }
  .mic-big.on { animation: micPulse 1s ease-in-out infinite; }
  .mic-big:disabled { filter: grayscale(.7); opacity: .6; cursor: default; }
  @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(236,72,153,.55); } 50% { box-shadow: 0 0 0 14px rgba(236,72,153,0); } }
  .side-btn { border: none; border-radius: 14px; padding: 9px 12px; font-weight: 800; cursor: pointer; background: #f3f0fa; color: #6b5b95; font-family: inherit; font-size: .85rem; }
  .type-row { display: none; gap: 6px; }
  .type-row.show { display: flex; }
  .type-row input { flex: 1; min-width: 0; font-size: 1rem; padding: 10px 12px; border-radius: 12px; border: 2px solid #ddd6fe; font-family: "Nunito", "Pretendard", sans-serif; outline: none; }
  .mic-label { text-align: center; font-size: .78rem; color: var(--text-soft); font-weight: 700; }

  .center-card { margin: auto; width: min(420px, 100%); background: #fff; border-radius: 26px; padding: 24px 18px; text-align: center; box-shadow: 0 10px 30px rgba(36,27,58,.12); }
  .center-card .big { font-size: 3.4rem; }
  .center-card h2 { font-family: "CookieRun", "Jua", sans-serif; color: #7c3aed; margin: 6px 0; }
  .center-card p { color: var(--text-dark); font-size: .92rem; line-height: 1.45; margin: 6px 0 14px; }
  .go-btn { border: none; border-radius: 18px; padding: 14px 26px; font-weight: 800; font-size: 1.1rem; cursor: pointer; color: #fff; background: linear-gradient(135deg, #8b5cf6, #ec4899); font-family: inherit; }
  .go-btn.ghost { background: #f3f0fa; color: #6b5b95; font-size: .95rem; padding: 11px 18px; }
  .phrases { text-align: left; margin: 10px 0 14px; display: flex; flex-direction: column; gap: 6px; }
  .phrase { display: flex; align-items: center; gap: 8px; background: #f5f3ff; border-radius: 12px; padding: 8px 10px; }
  .phrase .pe { font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; color: #4338ca; }
  .phrase .pk { font-size: .78rem; color: var(--text-soft); }
  .phrase > div { flex: 1; }
  .hidden { display: none !important; }
  @media (max-width: 560px) {
    .ai-top h1 { font-size: 1.2rem; }
    .ai-top .spacer { width: 64px; }
    .msg .en { font-size: .98rem; }
    .mic-big { width: 68px; height: 68px; font-size: 1.7rem; }
  }
</style>
</head>
<body>
<section id="screen-ai" class="screen active">
  <div class="ai-wrap">
    <div class="ai-top">
      <a class="ai-back" href="index.html">← 나가기</a>
      <h1>🤖 AI 스피킹하기</h1>
      <span class="spacer"></span>
    </div>

    <!-- 시작 / 끝 / 오류 안내 -->
    <div class="center-card" id="intro">
      <div class="big">🎭</div>
      <h2>오늘의 상황극</h2>
      <p>AI 선생님이 매일 새로운 상황극을 내 줘요.<br>🎤 를 누르고 <b>영어로 직접 말해요!</b><br><small>대화가 끝나면 선생님이 오늘 대화를 정리해서 들려줘요</small></p>
      <button class="go-btn" id="btn-start" type="button">시작하기 ▶</button>
    </div>

    <div class="scene-card hidden" id="scene">
      <div class="sc-emoji" id="sc-emoji">🎭</div>
      <div><div class="sc-title" id="sc-title"></div><div class="sc-text" id="sc-text"></div></div>
    </div>
    <div class="chat hidden" id="chat"></div>

    <div class="center-card hidden" id="wrap">
      <div class="big">🏆</div>
      <h2>오늘의 상황극 끝!</h2>
      <button class="go-btn brief-play" id="btn-brief" type="button">🔊 선생님 브리핑 듣기</button>
      <div class="brief-msg" id="brief-msg"></div>
      <div class="brief" id="wrap-summary"></div>
      <div class="wrap-h" id="fixes-h">🔁 이렇게 말하면 더 좋아요</div>
      <div class="fixes" id="wrap-fixes"></div>
      <div class="wrap-h">⭐ 오늘의 표현</div>
      <div class="phrases" id="wrap-phrases"></div>
      <div class="key-row" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="go-btn ghost" id="btn-review" type="button">대화 다시 보기</button>
        <button class="go-btn" id="btn-more" type="button">새 상황극 하나 더 ▶</button>
      </div>
    </div>
  </div>

  <div class="dock hidden" id="dock" style="width:min(720px,100vw);margin:0 auto;box-sizing:border-box">
    <div class="hint" id="hint"></div>
    <div class="live" id="live"></div>
    <div class="mic-row">
      <button class="side-btn" id="btn-type" type="button" title="글자로 쓰기">⌨️</button>
      <button class="mic-big" id="btn-mic" type="button" title="눌러서 말하기">🎤</button>
      <button class="side-btn" id="btn-end" type="button" title="오늘은 그만">그만</button>
    </div>
    <div class="mic-label" id="mic-label">🎤 를 누르고 영어로 말해요</div>
    <div class="type-row" id="type-row">
      <input id="type-input" type="text" placeholder="영어로 써도 돼요" autocomplete="off" autocapitalize="off">
      <button class="side-btn" id="btn-send" type="button">보내기</button>
    </div>
  </div>
</section>

<script src="ai-config.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var STORE = "talk-ai-session", RECENT = "talk-ai-recent";

  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } }
  function pw() { try { return localStorage.getItem(TalkAI.PW_KEY) || ""; } catch (e) { return ""; } }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // 비밀번호가 없으면(🔑 로 안 열었으면) 메뉴로 돌려보내요
  if (!pw()) { location.replace("index.html"); return; }

  // ---- 영어 읽어주기 ----
  var voice = null, koVoice = null;
  function pickVoice() {
    if (!window.speechSynthesis) return;
    var vs = speechSynthesis.getVoices();
    voice = vs.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] || vs.filter(function (v) { return /^en/i.test(v.lang); })[0] || null;
    koVoice = vs.filter(function (v) { return /^ko/i.test(v.lang); })[0] || null;
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function utter(t, ko) {
    var u = new SpeechSynthesisUtterance(t);
    u.lang = ko ? "ko-KR" : "en-US"; u.rate = ko ? 1 : 0.9; u.pitch = 1.05;
    if (ko ? koVoice : voice) u.voice = ko ? koVoice : voice;
    return u;
  }
  function speak(t) { speakSeq([[t, false]]); }
  // 차례로 읽어 줘요: [[글, 한국어인지], ...]  (틀렸을 때: 바른 영어 → 한국어 설명 → 선생님의 다음 말)
  function speakSeq(items) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      items.forEach(function (it) { if (it[0]) speechSynthesis.speak(utter(it[0], it[1])); });
    } catch (e) { /* ignore */ }
  }
  // 난이도: 끝까지 마친 상황극 3개마다 한 단계씩 (1 ~ 5)
  var DONE = "talk-ai-done";
  function level() { return Math.min(5, 1 + Math.floor(load(DONE, 0) / 3)); }

  // 대화 상태: 오늘 날짜의 상황극 하나 (새로고침해도 이어져요)
  // S = { date, kickoff, history: [{role, content}], turns: [화면에 그릴 것들], scene: {...}, ended, wrap }
  var S = null, busy = false;
  var chat = $("chat");

  function show(id, on) { $(id).classList.toggle("hidden", !on); }
  function scrollDown() { chat.scrollTop = chat.scrollHeight; }

  function sayBtn(text) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "mini"; b.textContent = "🔊 듣기";
    b.addEventListener("click", function () { speak(text); });
    return b;
  }
  function addAi(turn) {
    var d = document.createElement("div");
    d.className = "msg ai";
    d.innerHTML = '<div class="who">' + esc((S.scene.emoji || "🤖") + " " + (S.scene.role || "AI")) + (turn.retry ? '<span class="retry-tag">🔁 다시 대답해 볼까요?</span>' : "") + '</div><div class="en">' + esc(turn.say) + '</div><div class="ko">' + esc(turn.ko || "") + "</div>";
    var tools = document.createElement("div"); tools.className = "tools";
    tools.appendChild(sayBtn(turn.say));
    if (turn.ko) {
      var k = document.createElement("button"); k.type = "button"; k.className = "mini"; k.textContent = "한국어 보기";
      k.addEventListener("click", function () { var el = d.querySelector(".ko"); el.classList.toggle("show"); k.textContent = el.classList.contains("show") ? "한국어 숨기기" : "한국어 보기"; });
      tools.appendChild(k);
    }
    d.appendChild(tools);
    chat.appendChild(d);
  }
  function addMe(text) {
    var d = document.createElement("div");
    d.className = "msg me";
    d.innerHTML = '<div class="en">' + esc(text) + "</div>";
    chat.appendChild(d);
  }
  // (예전에 저장된 대화에만 있는 '이렇게 말해요' 상자 — 지금은 대화 중에 한국어 설명 없이 영어로만 이어가요)
  function addFix(turn) {
    if (turn.fix) {
      var f = document.createElement("div");
      f.className = "fix";
      f.innerHTML = "👩‍🏫 이렇게 말해요<br><b>" + esc(turn.fix) + "</b> " + (turn.fix_ko ? '<div class="fix-ko">' + esc(turn.fix_ko) + "</div>" : "");
      var fb = document.createElement("button");
      fb.type = "button"; fb.className = "mini"; fb.textContent = "🔊 듣기";
      fb.addEventListener("click", function () { speakSeq([[turn.fix, false], [turn.fix_ko, true]]); });
      f.appendChild(fb);
      chat.appendChild(f);
    }
  }
  // 힌트는 '💡 힌트 보기'를 눌렀을 때만: 한글 뜻 위, 영어 문장 아래 두 줄
  function setHint(turn) {
    var h = $("hint");
    h.innerHTML = "";
    if (!turn || turn.end || !turn.example) return;
    var b = document.createElement("button");
    b.type = "button"; b.className = "hint-btn"; b.textContent = "💡 힌트 보기";
    b.addEventListener("click", function () {
      h.innerHTML = "";
      var box = document.createElement("div"); box.className = "hint-box";
      box.innerHTML = '<span class="hb-ico">💡</span><div class="hb-lines"><div class="hb-ko">' + esc(turn.example_ko || turn.hint || "") + '</div><div class="hb-en">' + esc(turn.example) + "</div></div>";
      box.appendChild(sayBtn(turn.example));
      h.appendChild(box);
    });
    h.appendChild(b);
  }
  function typing(on) {
    var t = $("typing-dots");
    if (on && !t) { t = document.createElement("div"); t.id = "typing-dots"; t.className = "typing"; t.innerHTML = "<span>●</span><span>●</span><span>●</span>"; chat.appendChild(t); scrollDown(); }
    if (!on && t) t.remove();
  }
  function setBusy(on) { busy = on; $("btn-mic").disabled = on; $("btn-send").disabled = on; typing(on); }

  // 저장된 대화를 화면에 다시 그려요
  function renderAll() {
    chat.innerHTML = "";
    $("sc-emoji").textContent = S.scene.emoji || "🎭";
    $("sc-title").innerHTML = esc(S.scene.title || "오늘의 상황극") + ' <span class="lv">Lv.' + (S.level || level()) + "</span>";
    $("sc-text").textContent = S.scene.scene || "";
    S.turns.forEach(function (t) { if (t.me) addMe(t.me); else { if (t.fixFor) addFix(t.ai); addAi(t.ai); } });
    var lastAi = null;
    for (var i = S.turns.length - 1; i >= 0; i--) if (S.turns[i].ai) { lastAi = S.turns[i].ai; break; }
    setHint(lastAi);
    scrollDown();
  }
  function enterChat() {
    show("intro", false); show("wrap", false);
    show("scene", true); show("chat", true); show("dock", !S.ended);
    renderAll();
  }

  function fail(r) {
    setBusy(false);
    var m = {
      wrong_password: "비밀번호가 바뀌었어요. 메뉴의 🔑 로 다시 열어 주세요.",
      no_api_key: "아직 AI 키가 설정되지 않았어요. (부모님: Supabase 에 GEMINI_API_KEY 를 넣어 주세요)",
      network: "인터넷 연결을 확인해 주세요.",
      busy: "AI 가 바빠요. 잠시 뒤에 다시 말해 볼까요?",
      refused: "AI 가 그 말에는 대답하기 어렵대요. 다른 말로 해 볼까요?"
    }[r.error] || "AI 와 연결이 잠깐 끊겼어요. 다시 해 볼까요?";
    $("mic-label").textContent = "⚠️ " + m;
    if (r.error === "wrong_password") { try { localStorage.removeItem(TalkAI.PW_KEY); } catch (e) { /* ignore */ } setTimeout(function () { location.replace("index.html"); }, 2500); }
  }

  function start() {
    if (busy) return;
    show("intro", false); show("wrap", false);
    show("scene", true); show("chat", true); show("dock", true);
    chat.innerHTML = "";
    $("sc-title").textContent = "AI 가 오늘의 상황을 고르는 중…"; $("sc-text").textContent = ""; $("sc-emoji").textContent = "🎲";
    setBusy(true);
    TalkAI.call({ action: "start", password: pw(), date: today(), recent: load(RECENT, []), level: level() }).then(function (r) {
      if (!r.turn) return fail(r);
      setBusy(false);
      var t = r.turn;
      S = { date: today(), history: [{ role: "user", content: r.kickoff }, { role: "assistant", content: JSON.stringify(t) }],
        turns: [{ ai: t }], scene: { title: t.title, scene: t.scene, emoji: t.emoji, role: t.role }, level: level(), ended: false, wrap: null };
      var rec = load(RECENT, []); rec.push(t.title); save(RECENT, rec.slice(-20));
      save(STORE, S);
      enterChat();
      speak(t.say);
      $("mic-label").textContent = SR ? "🎤 를 누르고 영어로 말해요" : "⌨️ 로 영어를 써서 대답해요 (이 브라우저는 마이크 인식이 안 돼요)";
    });
  }

  function send(text) {
    text = String(text || "").trim();
    if (!text || busy || !S || S.ended) return;
    addMe(text);
    S.turns.push({ me: text });
    S.history.push({ role: "user", content: text });
    save(STORE, S);
    $("live").textContent = ""; $("hint").innerHTML = "";
    setBusy(true);
    TalkAI.call({ action: "reply", password: pw(), history: S.history, level: S.level || level() }).then(function (r) {
      if (!r.turn) {
        // 실패하면 방금 말한 것은 기록에서 빼서 다시 말할 수 있게
        S.history.pop(); S.turns.pop(); save(STORE, S);
        renderAll();
        return fail(r);
      }
      setBusy(false);
      var t = r.turn;
      S.history.push({ role: "assistant", content: JSON.stringify(t) });
      S.turns.push({ ai: t, fixFor: true });
      save(STORE, S);
      addFix(t); addAi(t); setHint(t); scrollDown();
      // 대화 중에는 영어로만 이어가요 (알맞지 않은 대답이면 AI 가 영어로 다시 물어봐요)
      speak(t.say);
      $("mic-label").textContent = "🎤 를 누르고 영어로 말해요";
      if (t.end) setTimeout(finish, 2200);
    });
  }

  function finish() {
    if (!S || busy) return;
    if (!S.ended) save(DONE, load(DONE, 0) + 1);
    S.ended = true; save(STORE, S);
    show("dock", false);
    setBusy(true);
    TalkAI.call({ action: "wrapup", password: pw(), history: S.history, level: S.level || level() }).then(function (r) {
      setBusy(false);
      S.wrap = r.wrap || { briefing: "오늘도 영어로 이야기 나눠서 정말 멋졌어요!", phrases: [], fixes: [] };
      save(STORE, S);
      showWrap();
      playBrief();
    });
  }
  function showWrap() {
    show("scene", false); show("chat", false); show("dock", false); show("intro", false);
    show("wrap", true);
    $("wrap-summary").textContent = S.wrap.briefing || S.wrap.summary || "";
    var fx = $("wrap-fixes"); fx.innerHTML = "";
    (S.wrap.fixes || []).forEach(function (f) {
      var d = document.createElement("div"); d.className = "fixrow";
      d.innerHTML = (f.said ? '<div class="said">' + esc(f.said) + "</div>" : "") + '<div class="better">' + esc(f.better) + "</div><div>" + esc(f.ko) + "</div>";
      d.appendChild(sayBtn(f.better));
      fx.appendChild(d);
    });
    show("fixes-h", (S.wrap.fixes || []).length > 0);
    var box = $("wrap-phrases"); box.innerHTML = "";
    (S.wrap.phrases || []).forEach(function (p) {
      var d = document.createElement("div"); d.className = "phrase";
      d.innerHTML = '<div><div class="pe">' + esc(p.en) + '</div><div class="pk">' + esc(p.ko) + "</div></div>";
      d.appendChild(sayBtn(p.en));
      box.appendChild(d);
    });
  }

  // ---- 선생님 브리핑: Gemini 목소리로 읽어 줘요 (한 번 받은 소리는 다시 들을 때 그대로 써요) ----
  var briefAudio = null, briefUrl = "", briefFor = "", briefLoading = false;
  function pcmToWav(b64, mime) {
    // 이미 wav · mp3 같은 파일로 오면 그대로 (L16 · pcm 처럼 소리 값만 오면 wav 머리말을 붙여요)
    if (!/l16|pcm/i.test(mime || "")) {
      var raw = atob(b64), arr = new Uint8Array(raw.length);
      for (var q = 0; q < raw.length; q++) arr[q] = raw.charCodeAt(q);
      return new Blob([arr], { type: (mime || "audio/wav").split(";")[0] });
    }
    var rate = +((/rate=(\d+)/.exec(mime || "") || [])[1] || 24000);
    var bin = atob(b64), n = bin.length, buf = new ArrayBuffer(44 + n), v = new DataView(buf), i;
    function str(o, t) { for (var k = 0; k < t.length; k++) v.setUint8(o + k, t.charCodeAt(k)); }
    str(0, "RIFF"); v.setUint32(4, 36 + n, true); str(8, "WAVE"); str(12, "fmt "); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n, true);
    for (i = 0; i < n; i++) v.setUint8(44 + i, bin.charCodeAt(i));
    return new Blob([buf], { type: "audio/wav" });
  }
  function briefState(on, msg) { $("btn-brief").classList.toggle("on", on); $("btn-brief").textContent = on ? "⏸ 듣는 중… (누르면 멈춰요)" : "🔊 선생님 브리핑 듣기"; $("brief-msg").textContent = msg || ""; }
  function playBrief() {
    var text = S && S.wrap && (S.wrap.briefing || S.wrap.summary);
    if (!text || briefLoading) return;
    try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    if (briefAudio && !briefAudio.paused) { briefAudio.pause(); briefState(false); return; }
    if (briefAudio && briefFor === text) { briefAudio.currentTime = 0; briefAudio.play().then(function () { briefState(true); }, function () { briefState(false, "🔊 를 눌러서 들어요"); }); return; }
    briefLoading = true;
    briefState(false, "선생님 목소리를 준비하고 있어요…");
    TalkAI.call({ action: "tts", password: pw(), text: text }).then(function (r) {
      briefLoading = false;
      if (!r.audio) { briefState(false, "목소리를 불러오지 못했어요. 잠시 뒤 🔊 를 다시 눌러 주세요."); return; }
      if (briefUrl) URL.revokeObjectURL(briefUrl);
      briefUrl = URL.createObjectURL(pcmToWav(r.audio, r.mime));
      briefAudio = new Audio(briefUrl); briefFor = text;
      briefAudio.onended = function () { briefState(false); };
      briefAudio.play().then(function () { briefState(true); }, function () { briefState(false, "🔊 를 눌러서 들어요"); });
    });
  }
  $("btn-brief").addEventListener("click", playBrief);

  // ---- 🎤 말하기: 말하는 동안 글자가 보이고, 끝나면 바로 AI 에게 보내요 ----
  var rec = null;
  $("btn-mic").addEventListener("click", function () {
    if (busy) return;
    if (!SR) { $("type-row").classList.add("show"); $("type-input").focus(); return; }
    if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } return; }
    try { speechSynthesis.cancel(); } catch (e) { /* ignore */ }
    var r = new SR();
    rec = r;
    r.lang = "en-US"; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    var finalText = "";
    r.onresult = function (ev) {
      var txt = "";
      for (var i = 0; i < ev.results.length; i++) { txt += ev.results[i][0].transcript; if (ev.results[i].isFinal) finalText = txt; }
      $("live").textContent = txt;
    };
    r.onerror = function (ev) {
      if (ev.error === "not-allowed" || ev.error === "service-not-allowed") $("mic-label").textContent = "🎤 마이크를 쓸 수 있게 허용해 주세요!";
      else if (ev.error === "no-speech") $("mic-label").textContent = "소리가 안 들렸어요. 🎤 를 누르고 크게 말해 봐요!";
    };
    r.onend = function () {
      rec = null;
      $("btn-mic").classList.remove("on");
      var t = finalText || $("live").textContent;
      if (t) send(t);
      else if ($("mic-label").textContent.indexOf("듣고") >= 0) $("mic-label").textContent = "소리가 안 들렸어요. 🎤 를 누르고 크게 말해 봐요!";
    };
    try { r.start(); } catch (e) { rec = null; return; }
    $("btn-mic").classList.add("on");
    $("live").textContent = "";
    $("mic-label").textContent = "듣고 있어요… 다 말하면 잠깐 기다리거나 🎤 를 한 번 더 눌러요";
  });
  $("btn-type").addEventListener("click", function () { $("type-row").classList.toggle("show"); if ($("type-row").classList.contains("show")) $("type-input").focus(); });
  function sendTyped() { var v = $("type-input").value; if (v.trim()) { $("type-input").value = ""; send(v); } }
  $("btn-send").addEventListener("click", sendTyped);
  $("type-input").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) sendTyped(); });
  $("btn-end").addEventListener("click", function () { if (!busy && S && confirm("오늘 상황극을 여기서 마칠까요?")) finish(); });
  $("btn-start").addEventListener("click", start);
  $("btn-more").addEventListener("click", function () { if (briefAudio) { briefAudio.pause(); briefState(false); } start(); });
  $("btn-review").addEventListener("click", function () { show("wrap", false); show("scene", true); show("chat", true); renderAll(); var b = $("btn-back-wrap"); if (!b) { b = document.createElement("button"); b.id = "btn-back-wrap"; b.className = "go-btn ghost"; b.style.alignSelf = "center"; b.textContent = "← 정리 화면으로"; b.addEventListener("click", function () { b.remove(); showWrap(); }); } chat.appendChild(b); scrollDown(); });

  // 오늘 하던 상황극이 있으면 이어서 (날짜가 바뀌면 새 상황극)
  var old = load(STORE, null);
  if (old && old.date === today() && old.scene) {
    S = old;
    if (S.ended && S.wrap) showWrap();
    else if (S.ended) finish();
    else enterChat();
  }
})();
</script>
<script src="../shared/english-bg.js"></script>
