<!DOCTYPE html>
<html lang="ko" data-tts>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="manifest" href="../manifest.webmanifest">
<title>문장 퍼즐 조립</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../spelling/style.css">
<link rel="stylesheet" href="../spelling/guidebook.css">
<link rel="stylesheet" href="talk.css">
<link rel="stylesheet" href="../shared/game-title.css">
<link rel="stylesheet" href="../shared/english-bg.css">
</head>
<body>
<script src="../spelling/guidebook.js"></script>
<script src="talk-common.js"></script>
<script>
(function () {
  "use strict";
  // [상황 미션, 순서대로 모을 조각들, 같은 자리의 틀린 조각들(어색한 어순 · 틀린 표현)]
  var DATA = {
    easy: [
      ["친구에게 처음 만나 반갑다고 해 봐!", ["Nice to", "meet you!"], ["Nice for", "meets you!"]],
      ["친구의 이름을 물어봐!", ["What's", "your name?"], ["Where's", "you name?"]],
      ["정말 고맙다고 말해 봐!", ["Thank you", "so much!"], ["Thanks you", "very much the!"]],
      ["친구에게 기분이 어떤지 물어봐!", ["How", "are you?"], ["Who", "is you?"]],
      ["도와줘서 고맙다고 해 봐!", ["Thanks", "for", "your help!"], ["Thank", "to", "you help!"]],
      ["내일 보자고 인사해 봐!", ["See you", "tomorrow!"], ["Look you", "yesterday!"]],
      ["배가 너무 고프다고 말해 봐!", ["I'm", "so hungry."], ["I", "hungry am."]],
      ["친구에게 미안하다고 해 봐!", ["I'm", "so sorry."], ["I", "sorry so."]],
      ["친구의 생일을 축하해 줘!", ["Happy", "birthday!"], ["Funny", "birthdays!"]],
      ["선생님께 아침 인사를 해 봐!", ["Good", "morning!"], ["Well", "mornings!"]]
    ],
    normal: [
      ["친구에게 방과 후에 놀자고 자연스럽게 제안해 봐!", ["Do you want to", "hang out", "after school?"], ["Are you want", "play with me", "before school?"]],
      ["물을 좀 달라고 부탁해 봐!", ["Can I", "have some", "water, please?"], ["Can I am", "have any", "waters, please?"]],
      ["친구가 어디에 사는지 물어봐!", ["Where", "do you", "live?"], ["What", "are you", "lives?"]],
      ["지금 몇 시인지 물어봐!", ["What", "time", "is it?"], ["How", "clock", "it is?"]],
      ["같이 점심 먹자고 해 봐!", ["Let's", "have lunch", "together!"], ["Let", "has lunch", "togethers!"]],
      ["무슨 색을 좋아하는지 물어봐!", ["What color", "do you", "like?"], ["Which colors", "are you", "likes?"]],
      ["창문을 열어 달라고 공손하게 부탁해 봐!", ["Could you", "open the window,", "please?"], ["Could you are", "opens the window,", "pleases?"]],
      ["친구에게 지금 뭐 하는지 물어봐!", ["What", "are you", "doing?"], ["Where", "do you", "doing?"]],
      ["넘어진 친구에게 괜찮냐고 물어봐!", ["Are", "you", "okay?"], ["Is", "your", "okays?"]],
      ["숙제를 다 했는지 물어봐!", ["Did you", "finish", "your homework?"], ["Do you", "finished", "you homework?"]]
    ],
    hard: [
      ["넘어진 친구에게 괜찮은지, 반창고가 필요한지 물어봐!", ["Are you okay?", "Do you", "need", "a band-aid?"], ["Is you okay?", "Does you", "needs", "an band-aid?"]],
      ["도서관이 어디인지 공손하게 물어봐!", ["Excuse me,", "could you tell me", "where", "the library is?"], ["Excuse to me,", "could you telling me", "what", "is the library?"]],
      ["이번 주말에 뭘 할 건지 물어봐!", ["What", "are you going to", "do", "this weekend?"], ["Which", "are you go to", "doing", "last weekend?"]],
      ["친구를 생일 파티에 초대해 봐!", ["Would you like", "to come", "to my", "birthday party?"], ["Would you likes", "coming", "at my", "birthdays party?"]],
      ["같이 숙제하자고 제안해 봐!", ["How about", "doing", "our homework", "together?"], ["How about to", "do", "we homework", "togethers?"]],
      ["연필을 잠깐 빌려도 되는지 물어봐!", ["Can I", "borrow", "your pencil", "for a minute?"], ["Can I am", "borrowing", "you pencil", "for an minute?"]],
      ["이 상자를 같이 들어 달라고 부탁해 봐!", ["Could you", "help me", "with", "this box?"], ["Could you are", "helps me", "to", "this boxes?"]],
      ["친구에게 어제 뭐 했는지 물어봐!", ["What", "did you", "do", "yesterday?"], ["What", "do you", "did", "tomorrow?"]],
      ["늦어서 미안하다고, 버스가 느렸다고 말해 봐!", ["I'm sorry", "I'm late.", "The bus", "was slow."], ["I'm sorry to", "I late.", "A bus", "were slow."]],
      ["학교에 같이 걸어가자고 해 봐!", ["Let's", "walk", "to school", "together!"], ["Let's to", "walking", "at school", "togethers!"]]
    ]
  };

  Talk.mount({
    id: "talk_sentence", title: "문장 퍼즐 조립", unit: "문장", total: 8, goLabel: "시작 ▶",
    levels: [
      { id: "easy", name: "쉬움", emoji: "🐣", desc: "조각 2~3개 · 인사말", bg: "#ecfccb", c: "#65a30d", decoys: 1 },
      { id: "normal", name: "보통", emoji: "🐥", desc: "조각 3개 · 물어보기 · 부탁", bg: "#dbeafe", c: "#2563eb", decoys: 2 },
      { id: "hard", name: "어려움", emoji: "🦅", desc: "조각 4개 · 긴 문장", bg: "#fce7f3", c: "#db2777", decoys: 2 }
    ],
    guide: function () {
      return [
        { icon: "🎯", title: "상황 미션", text: "위에 <b>이렇게 말해 봐!</b> 하는 상황이 나와요. 🔊 를 누르면 완성 문장을 들을 수 있어요." },
        { icon: "🧩", title: "조각을 끌어다 맞춰요", text: "아래 퍼즐 조각을 <b>손가락으로 끌어서</b> 빈칸에 놓아요. 조각을 <b>톡</b> 누르면 앞쪽 빈칸에 들어가요.<br>예) <b>Do you want to</b> → <b>hang out</b> → <b>after school?</b>" },
        { icon: "🔀", title: "자리가 다르면 돌아와요", text: "맞는 조각이라도 <b>자리가 다르면</b> 다시 돌아와요. 순서를 잘 생각해 봐요." },
        { icon: "🚫", title: "어색한 조각은 함정", text: "어순이 틀리거나 어색한 조각(예: <b>Are you want</b>)을 넣으면 하트가 하나 줄어요. 문장 <b>8개</b>를 완성하면 성공!" }
      ];
    },
    create: function (stage, lv) {
      var list = Talk.shuffle(DATA[lv.id].slice()).slice(0, 8);
      stage.innerHTML =
        '<div class="talk-bubble" id="sp-bubble"><div class="tb-who">🎯</div><div class="tb-main"><div class="tb-sub" id="sp-mission" style="font-size:.95rem;font-weight:800;color:var(--text-dark)"></div></div></div>' +
        '<div class="talk-msg" id="talk-msg"></div>' +
        '<div class="pz-board"><div class="pz-slots" id="pz-slots"></div><div class="pz-tray" id="pz-tray"></div></div>';
      var cur = null, filled = [], missed = false, lock = false, timer = 0;
      Talk.$("#sp-bubble").appendChild(Talk.sayButton(function () { return cur ? cur[1].join(" ") : ""; }));
      var slotBox = Talk.$("#pz-slots"), tray = Talk.$("#pz-tray");

      function ask(i) {
        cur = list[i]; missed = false; lock = false;
        filled = cur[1].map(function () { return false; });
        Talk.$("#sp-mission").textContent = cur[0];
        var b = Talk.$("#sp-bubble"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
        Talk.msg("조각을 끌어서 빈칸에 맞춰요!");
        slotBox.innerHTML = "";
        cur[1].forEach(function (c, k) {
          var s = document.createElement("div");
          s.className = "pz-slot";
          s.dataset.i = k;
          s.innerHTML = '<span class="pz-num">' + (k + 1) + "</span>";
          slotBox.appendChild(s);
        });
        // 함정 조각: 같은 자리의 어색한 표현 중에서 (정답 조각과 글자가 같은 건 빼고)
        var decoys = Talk.shuffle(cur[2].filter(function (w) { return cur[1].indexOf(w) < 0; })).slice(0, lv.decoys);
        var pieces = Talk.shuffle(cur[1].map(function (t) { return { t: t, ok: true }; }).concat(decoys.map(function (t) { return { t: t, ok: false }; })));
        tray.innerHTML = "";
        pieces.forEach(function (p) { tray.appendChild(makePiece(p)); });
      }

      function makePiece(p) {
        var el = document.createElement("div");
        el.className = "pz-piece";
        el.textContent = p.t;
        var sx = 0, sy = 0, dragging = false, id = null, over = null;
        function slotAt(x, y) {
          var hit = document.elementsFromPoint(x, y);
          for (var i = 0; i < hit.length; i++) if (hit[i].classList && hit[i].classList.contains("pz-slot")) return hit[i];
          return null;
        }
        el.addEventListener("pointerdown", function (e) {
          if (lock || Talk.paused() || el.classList.contains("placed")) return;
          e.preventDefault();
          id = e.pointerId; sx = e.clientX; sy = e.clientY; dragging = false;
          try { el.setPointerCapture(id); } catch (err) { /* ignore */ }
        });
        el.addEventListener("pointermove", function (e) {
          if (e.pointerId !== id) return;
          var dx = e.clientX - sx, dy = e.clientY - sy;
          if (!dragging && Math.abs(dx) + Math.abs(dy) > 6) { dragging = true; el.classList.add("dragging"); }
          if (!dragging) return;
          el.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.06)";
          var s = slotAt(e.clientX, e.clientY);
          if (s !== over) { if (over) over.classList.remove("hover"); over = s; if (over && !filled[+over.dataset.i]) over.classList.add("hover"); }
        });
        function end(e) {
          if (e.pointerId !== id) return;
          id = null;
          if (over) over.classList.remove("hover");
          var target = null;
          if (dragging) target = slotAt(e.clientX, e.clientY);
          else target = slotBox.children[filled.indexOf(false)] || null; // 톡: 앞쪽 빈칸으로
          over = null;
          el.classList.remove("dragging");
          el.style.transform = "";
          if (e.type === "pointercancel" || !target || lock || Talk.paused()) return;
          drop(p, el, +target.dataset.i);
        }
        el.addEventListener("pointerup", end);
        el.addEventListener("pointercancel", end);
        return el;
      }

      function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
      function drop(p, el, i) {
        if (filled[i]) { Talk.msg("거기는 이미 채웠어요! 빈칸에 놓아요"); return; }
        var slot = slotBox.children[i];
        if (p.t === cur[1][i]) {
          filled[i] = true;
          el.style.transition = "none"; // 빈칸으로 옮길 때 원래 자리에서 날아오는 움직임이 생기지 않게
          el.classList.add("placed");
          slot.classList.add("done");
          slot.innerHTML = "";
          slot.appendChild(el);
          void el.offsetWidth; el.style.transition = "";
          Talk.sfx.coin();
          if (filled.indexOf(false) < 0) {
            lock = true;
            var r = slotBox.getBoundingClientRect();
            Talk.good(r.left + r.width / 2, r.top, missed ? 10 : 15);
            var sentence = cur[1].join(" ");
            Talk.msg("🎉 <b>" + Talk.esc(sentence) + "</b>");
            slotBox.classList.add("win");
            Talk.speak(sentence);
            timer = setTimeout(function () { slotBox.classList.remove("win"); next(); }, 2100);
          } else Talk.msg("좋아요! 다음 조각은?");
          return;
        }
        missed = true;
        shake(el); shake(slot);
        if (p.ok) {
          Talk.msg("맞는 조각이지만 <b>자리가 달라요</b>! 순서를 생각해 봐요 🔀");
          Talk.sfx.bad();
          Talk.G.combo = 0;
        } else {
          Talk.msg("앗! <b>" + Talk.esc(p.t) + "</b> 는 어색한 표현이에요 🚫");
          el.classList.add("bad");
          setTimeout(function () { el.remove(); }, 450);
          if (!Talk.bad()) lock = true;
        }
      }
      function next() { if (Talk.G.over) return; if (Talk.next()) ask(Talk.G.q); }
      return { begin: function () { ask(0); }, stop: function () { clearTimeout(timer); } };
    }
  });
})();
</script>
<script src="../shared/game-title.js"></script>
<script src="../shared/english-bg.js"></script>
</body>
</html>
