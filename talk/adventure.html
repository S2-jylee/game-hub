<!DOCTYPE html>
<html lang="ko" data-tts>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="manifest" href="../manifest.webmanifest">
<title>어떻게 말할까? 상황 해결 어드벤처</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../spelling/style.css">
<link rel="stylesheet" href="../spelling/guidebook.css">
<link rel="stylesheet" href="talk.css">
<link rel="stylesheet" href="../shared/game-title.css">
<link rel="stylesheet" href="../shared/english-bg.css">
<style>
  .adv-wrap { position: relative; flex: 1; min-height: 0; display: flex; align-items: flex-start; justify-content: center; }
  .adv-map {
    --n: 7; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(8, 1fr); gap: 3px;
    width: min(100%, calc((100dvh - 210px) * 7 / 8), 560px); aspect-ratio: 7 / 8; padding: 6px; border-radius: 22px;
    background: var(--floor2, #e9dcc5); box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.6); touch-action: manipulation;
  }
  .adv-cell { border-radius: 9px; background: var(--floor, #f7efe2); display: flex; align-items: center; justify-content: center;
    font-size: clamp(1.1rem, 5.4vw, 2rem); line-height: 1; position: relative; cursor: pointer; user-select: none; }
  .adv-cell.deco { background: transparent; cursor: default; }
  .adv-cell.npc { background: #fff; box-shadow: 0 0 0 3px #facc15 inset; animation: npcBob 1.6s ease-in-out infinite; }
  .adv-cell.npc.done { box-shadow: none; animation: none; opacity: 0.85; }
  .adv-cell.npc.done::after { content: "✅"; position: absolute; right: -3px; top: -5px; font-size: 0.7em; }
  .adv-cell.me { background: #fff; box-shadow: 0 0 0 3px #3b82f6 inset; }
  @keyframes npcBob { 50% { transform: translateY(-3px); } }
  .adv-pad { position: absolute; right: 6px; bottom: 6px; width: 132px; height: 132px; z-index: 4; pointer-events: none; }
  .adv-pad button { position: absolute; width: 44px; height: 44px; border-radius: 14px; border: 2px solid rgba(255,255,255,.75);
    background: rgba(255, 255, 255, 0.35); color: rgba(36, 27, 58, 0.55); font-size: 1rem; pointer-events: auto; cursor: pointer; touch-action: none; }
  .adv-pad button:active { background: rgba(255,255,255,.75); }
  .adv-pad .u { left: 44px; top: 0; } .adv-pad .d { left: 44px; bottom: 0; } .adv-pad .l { left: 0; top: 44px; } .adv-pad .r { right: 0; top: 44px; }
  /* 대화 창 */
  .adv-talk { position: absolute; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; padding: 6px;
    background: rgba(59, 45, 92, 0.35); border-radius: 22px; }
  .adv-talk.show { display: flex; }
  .adv-card { width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; background: #fff; border-radius: 22px; padding: 12px; box-shadow: 0 12px 40px rgba(36,27,58,.25); }
  .adv-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .adv-head .who { font-size: 2rem; } .adv-head .nm { flex: 1; font-weight: 800; color: var(--text-dark); }
  .adv-head .step { font-size: 0.75rem; font-weight: 800; color: #7c2ce0; background: #f1e9ff; padding: 2px 9px; border-radius: 999px; }
  .adv-log { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .adv-line { max-width: 88%; padding: 8px 12px; border-radius: 16px; font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; font-size: 0.98rem; line-height: 1.3; }
  .adv-line.them { align-self: flex-start; background: #eff6ff; color: #1d4ed8; border-bottom-left-radius: 4px; }
  .adv-line.me { align-self: flex-end; background: #dcfce7; color: #166534; border-bottom-right-radius: 4px; }
  .adv-opts { display: flex; flex-direction: column; gap: 6px; }
  .adv-opt { border: 2px solid #e2d6f7; background: #faf7ff; border-radius: 14px; padding: 10px 12px; text-align: left; cursor: pointer;
    font-family: "Nunito", "Pretendard", sans-serif; font-weight: 800; font-size: 0.95rem; color: #3b2a63; }
  .adv-opt:active { transform: scale(0.98); }
  .adv-opt.no { border-color: #ef4444; background: #fef2f2; color: #b91c1c; animation: advShake 0.35s ease; pointer-events: none; opacity: 0.75; }
  @keyframes advShake { 25%, 75% { transform: translateX(-5px); } 50% { transform: translateX(5px); } }
  @media (max-width: 560px) { .adv-line, .adv-opt { font-size: 0.86rem; } .adv-pad { width: 120px; height: 120px; } .adv-pad button { width: 40px; height: 40px; } .adv-pad .u, .adv-pad .d { left: 40px; } .adv-pad .l, .adv-pad .r { top: 40px; } }
  /* 장소 고르기: 시계 놀이터 타일 구도(이모지 옆에 장소 이름) · 장소가 20곳이라 조금 작게
     PC 한 줄에 4개(칸 200px 이상) · 휴대폰 2개씩 */
  #screen-level { justify-content: flex-start; overflow-y: auto; }
  html body #level-grid { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 12px !important; }
  @media (max-width: 900px) { html body #level-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; } }
  html body #level-grid .level-btn { grid-template-columns: 48px minmax(0, 1fr); column-gap: 10px; padding: 12px; border-radius: 20px; }
  html body #level-grid .lv-emoji { width: 48px; height: 48px; font-size: 1.6rem; }
  html body #level-grid .lv-name { font-size: 1.1rem; }
  html body #level-grid .lv-desc { font-size: 0.76rem; }
  @media (max-width: 560px) {
    html body #level-grid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px !important; }
    html body #level-grid .level-btn { grid-template-columns: 40px minmax(0, 1fr); column-gap: 8px; padding: 10px 8px; border-radius: 16px; }
    html body #level-grid .lv-emoji { width: 40px; height: 40px; font-size: 1.35rem; }
    html body #level-grid .lv-name { font-size: 1rem; }
    html body #level-grid .lv-desc { font-size: 0.68rem; }
  }
</style>
</head>
<body>
<script src="../spelling/guidebook.js"></script>
<script src="talk-common.js"></script>
<script src="adventure-data.js"></script>
<script src="adv/classroom.js"></script>
<script src="adv/playground.js"></script>
<script src="adv/market.js"></script>
<script src="adv/airport.js"></script>
<script src="adv/restaurant.js"></script>
<script src="adv/hospital.js"></script>
<script src="adv/library.js"></script>
<script src="adv/zoo.js"></script>
<script src="adv/home.js"></script>
<script src="adv/station.js"></script>
<script src="adv/pool.js"></script>
<script src="adv/camping.js"></script>
<script src="adv/cinema.js"></script>
<script src="adv/salon.js"></script>
<script src="adv/bus.js"></script>
<script src="adv/museum.js"></script>
<script src="adv/themepark.js"></script>
<script src="adv/beach.js"></script>
<script src="adv/party.js"></script>
<script src="adv/farm.js"></script>
<script>
(function () {
  "use strict";
  var AREAS = window.ADV_AREAS; // adventure-data.js + adv/*.js: 장소 20곳 × 상황 50가지
  var W = 7, H = 8;

  Talk.mount({
    id: "talk_adventure", title: "어떻게 말할까?", unit: "친구", goLabel: "출발 ▶", startLabel: "대화 시작! 💬",
    levels: window.ADV_LEVELS, // adventure-data.js: 장소 20곳
    guide: function () {
      return [
        { icon: "🧒", title: "돌아다녀요", text: "나(<b>🙂</b>)를 <b>방향키</b>나 <b>▲▼◀▶</b>로 움직이거나, 가고 싶은 칸을 <b>톡</b> 눌러요." },
        { icon: "💛", title: "도움이 필요한 사람", text: "<b>노란 테두리</b> 사람에게 가면 대화가 시작돼요. 소리로도 들려줘요 🔊" },
        { icon: "💬", title: "2~3번 주고받기", text: "상황에 <b>알맞은 말</b>을 골라 대화를 이어가요. 틀리면 하트가 하나 줄고 다시 골라요." },
        Talk.canListen && { icon: "🎤", title: "말로 대답해도 돼요", text: "<b>🎤 눌러서 말하기</b>를 누르고 알맞은 말을 <b>소리 내어 말하면</b> 그 말을 고른 것과 같아요." },
        { icon: "⭐", title: "모두 도와주면 성공", text: "이 장소의 <b>세 사람</b>과 대화를 끝내면 성공! 장소마다 <b>50가지 상황</b> 중 3가지가 무작위로 나와요." }
      ].filter(Boolean);
    },
    create: function (stage, lv) {
      var AR = AREAS[lv.id];
      // 상황 50가지 중 3가지를 무작위로 골라 자리(spots)에 세워요
      var A = { floor: AR.floor, floor2: AR.floor2, start: AR.start, deco: AR.deco,
        npcs: Talk.shuffle(AR.pool.slice()).slice(0, AR.spots.length).map(function (p, i) {
          return { x: AR.spots[i][0], y: AR.spots[i][1], e: p.e, name: p.name, turns: p.turns };
        }) };
      Talk.setTotal(A.npcs.length);
      stage.innerHTML =
        '<div class="talk-msg" id="talk-msg"></div>' +
        '<div class="adv-wrap"><div class="adv-map" id="adv-map"></div>' +
        '<div class="adv-pad"><button class="u" data-d="0,-1">▲</button><button class="l" data-d="-1,0">◀</button><button class="r" data-d="1,0">▶</button><button class="d" data-d="0,1">▼</button></div>' +
        '<div class="adv-talk" id="adv-talk"><div class="adv-card"><div class="adv-head"><span class="who" id="at-who"></span><span class="nm" id="at-name"></span><span class="step" id="at-step"></span></div>' +
        '<div class="adv-log" id="at-log"></div><div class="adv-opts" id="at-opts"></div></div></div></div>';
      var map = Talk.$("#adv-map");
      map.style.setProperty("--floor", A.floor);
      map.style.setProperty("--floor2", A.floor2);
      var me = { x: A.start[0], y: A.start[1] };
      var done = {}, cells = [], walking = 0, talking = null, alive = true;
      var block = {};
      A.deco.forEach(function (d) { block[d[0] + "," + d[1]] = d[2]; });
      function npcAt(x, y) { for (var i = 0; i < A.npcs.length; i++) if (A.npcs[i].x === x && A.npcs[i].y === y) return i; return -1; }
      for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
        var c = document.createElement("div");
        c.className = "adv-cell";
        c.dataset.x = x; c.dataset.y = y;
        map.appendChild(c);
        cells.push(c);
      }
      function render() {
        cells.forEach(function (c) {
          var x = +c.dataset.x, y = +c.dataset.y, k = x + "," + y, n = npcAt(x, y);
          c.className = "adv-cell";
          c.textContent = "";
          if (block[k]) { c.classList.add("deco"); c.textContent = block[k]; }
          else if (n >= 0) { c.classList.add("npc"); if (done[n]) c.classList.add("done"); c.textContent = A.npcs[n].e; }
          else if (x === me.x && y === me.y) { c.classList.add("me"); c.textContent = "🙂"; }
        });
      }
      function free(x, y) { return x >= 0 && y >= 0 && x < W && y < H && !block[x + "," + y]; }
      // 한 칸 움직이기: 사람이 있는 칸으로 가면 그 사람과 대화해요
      function step(dx, dy) {
        if (Talk.paused() || talking !== null) return;
        var nx = me.x + dx, ny = me.y + dy;
        if (!free(nx, ny)) return;
        var n = npcAt(nx, ny);
        if (n >= 0) { if (!done[n]) openTalk(n); else Talk.msg("이미 도와줬어요 ✅ 다른 사람을 찾아봐요!"); return; }
        me.x = nx; me.y = ny;
        render();
      }
      // 칸을 톡: 그 칸(또는 사람 옆)까지 걸어가요
      function walkTo(tx, ty) {
        clearInterval(walking);
        var target = npcAt(tx, ty);
        var prev = {}, q = [[me.x, me.y]], seen = {}; seen[me.x + "," + me.y] = 1;
        var goal = null;
        while (q.length) {
          var p = q.shift();
          if ((target < 0 && p[0] === tx && p[1] === ty) || (target >= 0 && Math.abs(p[0] - tx) + Math.abs(p[1] - ty) === 1)) { goal = p; break; }
          [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (d) {
            var nx = p[0] + d[0], ny = p[1] + d[1], k = nx + "," + ny;
            if (seen[k] || !free(nx, ny) || npcAt(nx, ny) >= 0) return;
            seen[k] = 1; prev[k] = p; q.push([nx, ny]);
          });
        }
        if (!goal) return;
        var path = [];
        for (var cur = goal; cur && !(cur[0] === me.x && cur[1] === me.y); cur = prev[cur[0] + "," + cur[1]]) path.unshift(cur);
        if (target >= 0) path.push([tx, ty]);
        walking = setInterval(function () {
          if (!alive || talking !== null) { clearInterval(walking); return; }
          if (Talk.paused()) return;
          var nxt = path.shift();
          if (!nxt) { clearInterval(walking); return; }
          step(nxt[0] - me.x, nxt[1] - me.y);
        }, 130);
      }
      map.addEventListener("click", function (e) {
        var c = e.target.closest(".adv-cell");
        if (!c || talking !== null || Talk.paused()) return;
        walkTo(+c.dataset.x, +c.dataset.y);
      });
      Array.prototype.forEach.call(stage.querySelectorAll(".adv-pad button"), function (b) {
        b.addEventListener("pointerdown", function (e) { e.preventDefault(); clearInterval(walking); var d = b.dataset.d.split(","); step(+d[0], +d[1]); });
      });
      function onKey(e) {
        if (!alive || stage.offsetParent === null) return;
        var d = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] }[e.key];
        if (d) { e.preventDefault(); clearInterval(walking); step(d[0], d[1]); }
      }
      document.addEventListener("keydown", onKey);

      // ---- 대화 ----
      var turn = 0, missed = false;
      var box = Talk.$("#adv-talk"), log = Talk.$("#at-log"), opts = Talk.$("#at-opts");
      function line(who, text) {
        var d = document.createElement("div");
        d.className = "adv-line " + who;
        d.textContent = text;
        log.appendChild(d);
        box.querySelector(".adv-card").scrollTop = 1e5;
      }
      function openTalk(n) {
        talking = n; turn = 0;
        var p = A.npcs[n];
        // 그림이 남자면 남자 목소리, 여자면 여자 목소리 (내가 고른 대답은 다른 목소리)
        p.voice = p.voice || Talk.genderOf(p.e, p.name);
        Talk.$("#at-who").textContent = p.e;
        Talk.$("#at-name").textContent = p.name;
        log.innerHTML = "";
        box.classList.add("show");
        var say = Talk.sayButton(function () { return p.turns[Math.min(turn, p.turns.length - 1)][0]; }, p.voice);
        var old = box.querySelector(".adv-head .talk-say"); if (old) old.remove();
        box.querySelector(".adv-head").appendChild(say);
        showTurn();
      }
      function showTurn() {
        var p = A.npcs[talking], t = p.turns[turn];
        missed = false;
        Talk.$("#at-step").textContent = (turn + 1) + " / " + p.turns.length;
        line("them", t[0]);
        Talk.speak(t[0], p.voice);
        Talk.msg(Talk.canListen ? "알맞은 말을 고르거나 🎤 로 말해요!" : "알맞은 말을 골라요!");
        opts.innerHTML = "";
        var choices = Talk.shuffle([t[1], t[2], t[3]]), btns = [];
        // 🎤 소리 내어 말하면, 가장 비슷한 보기를 누른 것과 똑같이 처리해요
        var mic = Talk.micButton(function () { return choices; }, function (i) {
          if (btns[i] && !btns[i].classList.contains("no")) btns[i].click();
          else Talk.msg("음… 그 말은 이미 틀렸어요. 다른 말을 해 봐요!");
        }, "눌러서 말하기");
        if (mic) opts.appendChild(mic);
        choices.forEach(function (o) {
          var b = document.createElement("button");
          btns.push(b);
          b.type = "button"; b.className = "adv-opt"; b.textContent = o;
          b.addEventListener("click", function () {
            if (Talk.paused()) return;
            var r = b.getBoundingClientRect();
            if (o === t[1]) {
              opts.innerHTML = "";
              line("me", o);
              Talk.good(r.left + r.width / 2, r.top, missed ? 6 : 10);
              // 내 대답을 다 읽어 준 다음에 다음 말이 나와요
              turn++;
              Talk.speakThen(o, turn >= p.turns.length ? endTalk : showTurn, 1100, "me");
            } else {
              missed = true;
              b.classList.add("no");
              Talk.msg("음… 이 상황에 어울리는 말을 다시 골라 봐요");
              Talk.bad();
            }
          });
          opts.appendChild(b);
        });
      }
      function endTalk() {
        if (Talk.G.over) return;
        done[talking] = true;
        talking = null;
        box.classList.remove("show");
        render();
        Talk.sfx.coin();
        Talk.msg("⭐ 대화를 잘 마쳤어요! 다른 사람도 찾아가 봐요");
        Talk.next();
      }
      render();
      return {
        begin: function () { Talk.msg("노란 테두리 사람에게 가 봐요! 💛"); },
        stop: function () { alive = false; clearInterval(walking); document.removeEventListener("keydown", onKey); }
      };
    }
  });
})();
</script>
<script src="../shared/game-title.js"></script>
<script src="../shared/english-bg.js"></script>
</body>
