<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png"><link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"><link rel="apple-touch-icon" href="../icons/apple-touch-icon.png"><link rel="manifest" href="../manifest.webmanifest">
<title>카드 짝맞추기 메모리게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="guidebook.css">
<link rel="stylesheet" href="../shared/game-title.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <span class="sc-rise sc-bubble" style="left:5%;--s:34px;animation-duration:14s;animation-delay:-2s"></span>
  <span class="sc-rise sc-bubble" style="left:22%;--s:22px;animation-duration:11s;animation-delay:-7s"></span>
  <span class="sc-rise sc-bubble" style="left:78%;--s:40px;animation-duration:16s;animation-delay:-4s"></span>
  <span class="sc-rise sc-bubble" style="left:92%;--s:24px;animation-duration:12s;animation-delay:-9s"></span>
  <span class="sc-rise sc-bubble" style="left:60%;--s:18px;animation-duration:10s;animation-delay:-1s"></span>
  <span class="sc-rise" style="left:12%;--s:22px;animation-duration:15s;animation-delay:-10s">💗</span>
  <span class="sc-rise" style="left:86%;--s:20px;animation-duration:13s;animation-delay:-3s">🍬</span>
  <span class="sc-rise" style="left:40%;--s:18px;animation-duration:17s;animation-delay:-12s">💖</span>
  <span class="sc-twinkle" style="top:8%;left:10%;font-size:16px;animation-delay:0s">✦</span>
  <span class="sc-twinkle" style="top:14%;left:88%;font-size:20px;animation-delay:1s">✦</span>
  <span class="sc-twinkle" style="top:5%;left:60%;font-size:12px;animation-delay:1.8s">✦</span>
  <div class="sc-candy"></div>
</div>

<!-- 타이틀 화면 -->
<section id="screen-title" class="screen active">
  <div class="title-card">
    <div class="title-shapes" aria-hidden="true">
      <span class="ts ts1">🐶</span>
      <span class="ts ts2">🍎</span>
      <span class="ts ts3">🚗</span>
      <span class="ts ts4">⭐</span>
    </div>
    <h1>카드 짝맞추기</h1>
    <p class="subtitle">같은 그림 카드를 찾아 짝을 맞춰요!</p>
    <button id="btn-start" class="btn btn-primary btn-huge">시작하기</button>
  </div>
</section>

<!-- 사용자 선택 화면 -->
<section id="screen-user" class="screen">
  <div class="card">
    <h2>누구인가요?</h2>
    <div id="user-list" class="user-list"></div>
    <div class="user-new-row">
      <input id="user-name-input" class="user-name-input" type="text" maxlength="10" placeholder="새 이름을 입력하세요">
      <button id="btn-user-new-start" class="btn btn-primary btn-small">시작</button>
    </div>
    <button id="btn-user-guest" class="btn btn-ghost">게스트로 시작</button>
    <button id="btn-user-back" class="btn btn-ghost">처음으로</button>
  </div>
</section>


<!-- 스테이지 선택 화면 -->
<section id="screen-levelselect" class="screen">
  <h1 class="game-title">카드 짝맞추기</h1>
  <div class="card card-wide">
    <h2>스테이지 고르기 <span class="current-user-badge diff-tag"></span></h2>
    <div id="level-grid" class="level-grid"></div>
    <div class="result-buttons">
      <button id="btn-levelselect-title" class="btn btn-ghost">← 처음으로</button>
    </div>
  </div>
</section>

<!-- 게임 화면 -->
<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-item hud-stage">
      <span class="hud-label">스테이지</span>
      <span id="hud-stage-val" class="hud-value">1 / 100</span>
    </div>
    <div class="hud-item hud-name">
      <span id="hud-theme-val" class="hud-value hud-emoji">동물 친구들</span>
    </div>
    <div class="hud-item hud-tries">
      <span class="hud-label">시도</span>
      <span id="hud-tries-val" class="hud-value">0</span>
    </div>
    <div class="hud-item hud-timer">
      <span class="hud-label">시간</span>
      <span id="hud-timer-val" class="hud-value">0.0초</span>
    </div>
    <div class="hud-item hud-score">
      <span class="hud-label">점수</span>
      <span id="hud-score-val" class="hud-value">0</span>
    </div>
    <button id="btn-quit" class="btn btn-ghost btn-small">← 나가기</button>
  </header>

  <div class="stage-progress-bar"><div id="stage-progress-fill" class="stage-progress-fill"></div></div>

  <div id="board-wrap" class="board-wrap">
    <div id="card-grid" class="card-grid"></div>

    <div id="completion-modal" class="completion-modal">
      <div class="completion-card">
        <div id="completion-success" class="completion-variant">
          <div class="completion-emoji">🎉</div>
          <div class="completion-title">모두 찾았어요!</div>
          <div id="completion-stars" class="completion-stars"></div>
          <div id="completion-percent" class="completion-percent">0% 완성</div>
          <div id="completion-score" class="completion-scoregain">+0점</div>
          <div class="completion-buttons">
            <button id="btn-completion-next" class="btn btn-primary btn-huge">다음 스테이지</button>
            <button id="btn-completion-rank" class="btn btn-ghost">🏆 이 스테이지 랭킹</button>
            <button id="btn-completion-list" class="btn btn-ghost">스테이지 선택</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="screen-result" class="screen">
  <div class="card">
    <div class="result-emoji">🏆</div>
    <h2>다 완성했어요!</h2>
    <div class="result-score">총 점수 <span id="result-total-score">0</span>점</div>
    <table class="result-table" id="result-table"></table>
    <div class="result-buttons">
      <button id="btn-retry" class="btn btn-primary btn-huge">스테이지 더 고르기</button>
      <button id="btn-to-title" class="btn btn-ghost">← 처음으로</button>
    </div>
  </div>
</section>

<!-- 랭킹 모달: 화면(스테이지 고르기/게임 중) 어디서든 열 수 있도록 화면 밖, body 바로 아래에 둔다 -->
<div id="ranking-modal" class="ranking-modal">
  <div class="ranking-card">
    <div class="ranking-title">🏆 랭킹 <span id="ranking-stage-label" class="diff-tag"></span></div>
    <ol id="ranking-list" class="ranking-list"></ol>
    <div id="ranking-empty" class="ranking-empty">아직 기록이 없어요. 첫 번째 주인공이 되어보세요!</div>
    <button id="btn-ranking-close" class="btn btn-primary">닫기</button>
  </div>
</div>

<script src="guidebook.js"></script>
<script src="memory-data.js"></script>
<script src="game.js"></script>
<!-- hub-user -->
<!-- 게임 허브 연결: 시작하기 페이지 건너뛰기 · 고른 사용자로 바로 들어가기 · 이름표를 누르면 사용자 전환 -->
<style>
.hub-switch { cursor: pointer; background: #f5edff; color: #7c2ce0; border: 2px solid #a259ff; border-radius: 999px; padding: 3px 5px 3px 12px; box-shadow: none; white-space: nowrap; }
.hub-switch:hover { background: #ebdcff; border-color: #7c2ce0; }
.hub-switch::after { content: "전환"; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #7c2ce0; color: #fff; font-size: 0.72em; font-weight: 800; vertical-align: middle; }
</style>
<script>
(function () {
  var C = {"start":"btn-start","guest":"btn-user-guest","input":"user-name-input","submit":"btn-user-new-start"};
  var hub = null;
  try {
    hub = new URLSearchParams(location.search).get("hub");
    if (hub) sessionStorage.setItem("hub_user", hub); else hub = sessionStorage.getItem("hub_user");
  } catch (e) { /* storage unavailable, ignore */ }
  var $ = function (id) { return id ? document.getElementById(id) : null; };
  var start = $(C.start);
  if (!start) return;
  var shown = function (el) { return !!el && el.getClientRects().length > 0; };

  // 고른 사용자로 '누구인가요?' 화면을 건너뛰어요 (사용자 화면이 열리지 않는 경우는 그대로)
  if (hub && C.guest) start.addEventListener("click", function () {
    var guest = $(C.guest);
    if (!shown(guest)) return;
    if (hub === "guest") { guest.click(); return; }
    $(C.input).value = hub.slice(2);
    $(C.submit).click();
  });

  // 시작하기 페이지 건너뛰기: 처음 열면 '시작하기'를 대신 눌러요.
  // 나중에 '처음으로'로 다시 나오면, 메뉴로 가는 링크(← 영어 놀이 등)가 있으면 그리로, 사용자 화면이 있으면 다시 시작해요
  var scr = start.closest("section, .screen"), back = scr && scr.querySelector(".back-link, #title-back");
  var first = true, queued = false;
  function check() {
    queued = false;
    if (!shown(start) || document.querySelector(".gb-overlay.show, .modal:not(.hidden), .who-overlay.show")) return;
    if (first) { first = false; start.click(); }
    else if (back) back.click();
    else if (C.guest) start.click();
  }
  check();
  first = false;
  // 허브에서 연 게임인데 돌아갈 메뉴 링크가 없으면, 시작 페이지로 가는 '처음으로' 버튼은 할 일이 없어서 숨겨요 (허브의 🏠 를 써요)
  if (hub && !back) Array.prototype.forEach.call(document.querySelectorAll("#changeUser, #userBack, #btn-diff-back, #btn-user-back, #btn-levelselect-title, #btn-to-title, #btn-mode-title"), function (b) { b.style.display = "none"; });
  new MutationObserver(function () { if (!queued) { queued = true; requestAnimationFrame(check); } })
    .observe(document.body, { attributes: true, subtree: true, attributeFilter: ["class", "hidden", "style"] });

  // 이름표(👤 게스트)를 누르면 게임 허브의 '사용자 전환' 팝업이 열려요 (허브 안에서 열었을 때만)
  if (window.parent === window) return;
  var BADGES = ".user-badge, .user-badge-copy, #user-badge, .current-user-badge, #userBadge";
  Array.prototype.forEach.call(document.querySelectorAll(BADGES), function (el) {
    el.classList.add("hub-switch");
    el.title = "사용자 전환";
    el.addEventListener("click", function (e) {
      e.stopPropagation();
      window.parent.postMessage({ type: "hub-switch-user" }, "*");
    });
  });
})();
</script>
<script src="../shared/game-title.js"></script>
</body>
</html>
