<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>탱그램 칠교놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="guidebook.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <span class="sc-twinkle" style="top:6%;left:8%;font-size:18px;animation-delay:0s">✦</span>
  <span class="sc-twinkle" style="top:12%;left:30%;font-size:12px;animation-delay:1.2s">✦</span>
  <span class="sc-twinkle" style="top:5%;left:66%;font-size:16px;animation-delay:0.6s">✦</span>
  <span class="sc-twinkle" style="top:15%;left:90%;font-size:20px;animation-delay:1.8s">✦</span>
  <span class="sc-twinkle" style="top:80%;left:6%;font-size:14px;animation-delay:0.9s">✦</span>
  <span class="sc-twinkle" style="top:86%;left:94%;font-size:16px;animation-delay:0.3s">✦</span>
  <span class="sc-shape sc-tri" style="top:12%;left:4%;--c:#ffb3d6;animation-delay:0s"></span>
  <span class="sc-shape sc-sq" style="top:70%;left:3%;--c:#ffe27a;animation-delay:-2s"></span>
  <span class="sc-shape sc-par" style="top:10%;right:5%;--c:#9fd8ff;animation-delay:-4s"></span>
  <span class="sc-shape sc-tri" style="top:74%;right:4%;--c:#a7efc4;animation-delay:-6s"></span>
  <span class="sc-shape sc-sq" style="top:42%;right:2%;--c:#d7c2ff;animation-delay:-3s"></span>
  <span class="sc-shape sc-par" style="top:44%;left:1.5%;--c:#ffc89a;animation-delay:-5s"></span>
</div>

<!-- 타이틀 화면 -->
<section id="screen-title" class="screen active">
  <div class="title-card">
    <div class="title-shapes" aria-hidden="true">
      <span class="ts ts1"></span>
      <span class="ts ts2"></span>
      <span class="ts ts3"></span>
      <span class="ts ts4"></span>
    </div>
    <h1>탱그램 칠교놀이</h1>
    <p class="subtitle">모양을 빨리 맞춰봐요!</p>
    <button id="btn-start" class="btn btn-primary btn-huge">시작하기</button>
  </div>
</section>

<!-- 사용자 선택 화면 -->
<section id="screen-user" class="screen">
  <div class="card">
    <h2>누구인가요?</h2>
    <div id="user-list" class="user-list"></div>
    <div class="user-new-row">
      <input id="user-name-input" class="user-name-input" type="text" maxlength="10" placeholder="새 이름을 입력하세요">
      <button id="btn-user-new-start" class="btn btn-primary btn-small">시작</button>
    </div>
    <button id="btn-user-guest" class="btn btn-ghost">게스트로 시작</button>
    <button id="btn-user-back" class="btn btn-ghost">처음으로</button>
  </div>
</section>


<!-- 난이도 선택 화면 -->
<section id="screen-difficulty" class="screen">
  <div class="card">
    <h2>난이도를 골라주세요 <span class="current-user-badge diff-tag"></span></h2>
    <div class="difficulty-options">
      <button class="diff-btn" data-diff="easy">
        <div class="diff-emoji">🙂</div>
        <div class="diff-name">쉬움</div>
        <div class="diff-desc">점선 안내선이 보여요</div>
      </button>
      <button class="diff-btn" data-diff="hard">
        <div class="diff-emoji">🔥</div>
        <div class="diff-name">어려움</div>
        <div class="diff-desc">까만 실루엣만 보여요</div>
      </button>
    </div>
    <button id="btn-diff-back" class="btn btn-ghost">처음으로</button>
  </div>
</section>

<!-- 스테이지 선택 화면 -->
<section id="screen-levelselect" class="screen">
  <div class="card card-wide">
    <h2>스테이지 고르기 <span id="levelselect-diff-label" class="diff-tag"></span> <span class="current-user-badge diff-tag"></span></h2>
    <div id="level-grid" class="level-grid"></div>
    <div class="result-buttons">
      <button id="btn-levelselect-diff" class="btn btn-ghost">난이도 다시 고르기</button>
      <button id="btn-levelselect-title" class="btn btn-ghost">처음으로</button>
    </div>
  </div>
</section>

<!-- 게임 화면 -->
<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-item hud-stage">
      <span class="hud-label">스테이지</span>
      <span id="hud-stage-val" class="hud-value">1 / 100</span>
    </div>
    <div class="hud-item hud-name">
      <span id="hud-level-name" class="hud-value hud-emoji">모양 1</span>
    </div>
    <div class="hud-item hud-timer">
      <span class="hud-label">시간</span>
      <span id="hud-timer-val" class="hud-value">0.0초</span>
    </div>
    <button id="btn-quit" class="btn btn-ghost btn-small">← 나가기</button>
  </header>

  <div class="stage-progress-bar"><div id="stage-progress-fill" class="stage-progress-fill"></div></div>

  <div id="board-wrap" class="board-wrap">
    <svg id="board" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet">
      <g id="layer-target"></g>
      <g id="layer-pieces"></g>
      <g id="layer-toolbar"></g>
    </svg>

    <div id="completion-modal" class="completion-modal">
      <div class="completion-card">
        <div id="completion-retry" class="completion-variant">
          <div class="completion-emoji">🤔</div>
          <div class="completion-title">다시 해보세요!</div>
          <div class="completion-sub">아직 자리를 다 채우지 못했어요.</div>
          <button id="btn-completion-retry-ok" class="btn btn-primary btn-huge">다시 맞춰볼게요</button>
        </div>
        <div id="completion-success" class="completion-variant">
          <div class="completion-emoji">🎉</div>
          <div class="completion-title">훌륭해요!</div>
          <div class="completion-buttons">
            <button id="btn-completion-next" class="btn btn-primary btn-huge">다음 모양</button>
            <button id="btn-completion-list" class="btn btn-ghost">스테이지 선택</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button id="btn-rotate-left" class="btn btn-round" title="왼쪽으로 회전">↺</button>
    <button id="btn-rotate-right" class="btn btn-round" title="오른쪽으로 회전">↻</button>
    <button id="btn-flip" class="btn btn-round" title="뒤집기">⇋</button>
    <button id="btn-hint" class="btn btn-round btn-hint" title="힌트 (한 조각의 위치를 잠깐 보여줘요)" hidden>?</button>
    <button id="btn-complete" class="btn btn-primary btn-complete">완료</button>
  </div>
</section>

<!-- 결과 화면 -->
<section id="screen-result" class="screen">
  <div class="card">
    <div class="result-emoji">🏆</div>
    <h2>다 완성했어요!</h2>
    <div class="result-buttons">
      <button id="btn-retry" class="btn btn-primary btn-huge">스테이지 더 고르기</button>
      <button id="btn-to-title" class="btn btn-ghost">처음으로</button>
    </div>
  </div>
</section>

<script src="guidebook.js"></script>
<script src="tangram-data.js"></script>
<script src="game.js"></script>
<!-- hub-user -->
<!-- 게임 허브에서 고른 사용자(게스트 또는 이름)로 '누구인가요?' 화면을 건너뛰어요 -->
<script>
(function () {
  var hub = null;
  try {
    hub = new URLSearchParams(location.search).get("hub");
    if (hub) sessionStorage.setItem("hub_user", hub); else hub = sessionStorage.getItem("hub_user");
  } catch (e) { /* storage unavailable, ignore */ }
  var start = document.getElementById("btn-start");
  if (!hub || !start) return;
  start.addEventListener("click", function () {
    var guest = document.getElementById("btn-user-guest");
    // 사용자 화면이 열리지 않는 경우(구구단 놀이터에서 연 놀이 등)는 그대로 둬요
    if (!guest || !guest.getClientRects().length) return;
    if (hub === "guest") { guest.click(); return; }
    document.getElementById("user-name-input").value = hub.slice(2);
    document.getElementById("btn-user-new-start").click();
  });
})();
</script>
</body>
</html>
