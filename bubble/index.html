<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>알파벳 버블 팝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../spelling/style.css">
<link rel="stylesheet" href="../spelling/guidebook.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <span class="sc-bit" style="--x:6%;--s:34px;--dur:21s;--d:-4s">🎈</span>
  <span class="sc-bit" style="--x:20%;--s:28px;--dur:25s;--d:-13s">A</span>
  <span class="sc-bit" style="--x:34%;--s:40px;--dur:23s;--d:-8s">B</span>
  <span class="sc-bit" style="--x:50%;--s:30px;--dur:27s;--d:-17s">🎈</span>
  <span class="sc-bit" style="--x:64%;--s:36px;--dur:22s;--d:-2s">C</span>
  <span class="sc-bit" style="--x:78%;--s:28px;--dur:26s;--d:-11s">z</span>
  <span class="sc-bit" style="--x:90%;--s:38px;--dur:24s;--d:-20s">🫧</span>
</div>

<!-- 타이틀 화면 -->
<section id="screen-title" class="screen active">
  <div class="title-card">
    <div class="title-shapes" aria-hidden="true">
      <span class="ts ts1">🎈</span>
      <span class="ts ts2">A</span>
      <span class="ts ts3">B</span>
      <span class="ts ts4">C</span>
    </div>
    <h1>알파벳 버블 팝</h1>
    <p class="subtitle">알파벳 풍선을 순서대로 펑펑! 터뜨려요</p>
    <button id="btn-start" class="btn btn-primary btn-huge">시작하기</button>
    <div><a class="btn btn-ghost back-link" href="../english/index.html">← 영어 놀이</a></div>
  </div>
</section>

<!-- 사용자 선택 화면 -->
<section id="screen-user" class="screen">
  <div class="card">
    <h2>누구인가요?</h2>
    <div id="user-list" class="user-list"></div>
    <div class="user-new-row">
      <input id="user-name-input" class="user-name-input" type="text" maxlength="10" placeholder="새 이름을 입력하세요">
      <button id="btn-user-new" class="btn btn-primary btn-small">시작</button>
    </div>
    <button id="btn-user-guest" class="btn btn-ghost">게스트로 시작</button>
    <button id="btn-user-back" class="btn btn-ghost">처음으로</button>
  </div>
</section>

<!-- 놀이 고르기 화면 -->
<section id="screen-mode" class="screen">
  <div class="card card-wide">
    <h2>무엇을 해볼까요? <span class="user-badge diff-tag"></span></h2>
    <div id="mode-grid" class="level-grid"></div>
    <div class="row-buttons">
      <button id="btn-guide" class="btn btn-ghost">📖 가이드북</button>
      <button id="btn-mode-back" class="btn btn-ghost">처음으로</button>
    </div>
  </div>
</section>

<!-- 학년 고르기 (단어 만들기) -->
<section id="screen-grade" class="screen">
  <div class="card card-wide">
    <h2>몇 학년이에요? <span class="user-badge diff-tag"></span></h2>
    <p class="grade-note">학년에 맞는 영어 단어가 나와요</p>
    <div id="grade-grid" class="grade-grid"></div>
    <div class="row-buttons">
      <button id="btn-grade-back" class="btn btn-ghost">← 놀이 고르기</button>
    </div>
  </div>
</section>

<!-- 게임 화면 -->
<section id="screen-game" class="screen">
  <div class="hud">
    <button id="btn-quit" class="btn btn-ghost btn-small">← 나가기</button>
    <div class="time-box"><span class="time-ico">⏰</span><div class="time-bar"><div id="time-fill"></div></div><span id="time-text">60</span></div>
    <div class="hud-item hud-score" id="hud-score-box"><span class="hud-label">점수</span><span id="hud-score" class="hud-value">0</span></div>
  </div>
  <div class="q-card">
    <div id="q-emoji" class="q-emoji">🐶</div>
    <div class="q-main">
      <div id="q-slots" class="q-slots"></div>
      <div id="q-sub" class="q-sub">개</div>
    </div>
    <button id="btn-say" class="btn-round" type="button" title="다시 듣기">🔊</button>
  </div>
  <div id="game-msg" class="game-msg"></div>
  <div id="sky" class="sky"></div>
</section>

<!-- 결과 화면 -->
<section id="screen-result" class="screen">
  <div class="card">
    <h2 id="result-title">참 잘했어요!</h2>
    <div id="result-stars" class="result-stars"></div>
    <div id="result-text" class="result-text"></div>
    <div id="result-words" class="result-words"></div>
    <div class="row-buttons">
      <button id="btn-again" class="btn btn-primary">🔁 다시 하기</button>
      <button id="btn-result-mode" class="btn btn-ghost">놀이 고르기</button>
    </div>
  </div>
</section>

<script src="../spelling/words-data.js"></script>
<script src="../spelling/guidebook.js"></script>
<script src="../shared/mul-link.js"></script>
<script src="game.js"></script>
<!-- hub-user -->
<!-- 게임 허브에서 고른 사용자(게스트 또는 이름)로 '누구인가요?' 화면을 건너뛰어요 -->
<script>
(function () {
  var hub = null;
  try {
    hub = new URLSearchParams(location.search).get("hub");
    if (hub) sessionStorage.setItem("hub_user", hub); else hub = sessionStorage.getItem("hub_user");
  } catch (e) { /* storage unavailable, ignore */ }
  var start = document.getElementById("btn-start");
  if (!hub || !start) return;
  start.addEventListener("click", function () {
    var guest = document.getElementById("btn-user-guest");
    // 사용자 화면이 열리지 않는 경우(구구단 놀이터에서 연 놀이 등)는 그대로 둬요
    if (!guest || !guest.getClientRects().length) return;
    if (hub === "guest") { guest.click(); return; }
    document.getElementById("user-name-input").value = hub.slice(2);
    document.getElementById("btn-user-new").click();
  });
})();
</script>
</body>
</html>
