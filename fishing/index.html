<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>알파벳 낚시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="../spelling/style.css">
<link rel="stylesheet" href="../spelling/guidebook.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../shared/game-title.css">
<link rel="stylesheet" href="../shared/english-bg.css">
</head>
<body>

<div class="scene" aria-hidden="true">
  <span class="sc-bit" style="--x:6%;--s:34px;--dur:21s;--d:-4s">🎣</span>
  <span class="sc-bit" style="--x:20%;--s:28px;--dur:25s;--d:-13s">A</span>
  <span class="sc-bit" style="--x:34%;--s:40px;--dur:23s;--d:-8s">🐟</span>
  <span class="sc-bit" style="--x:50%;--s:30px;--dur:27s;--d:-17s">_</span>
  <span class="sc-bit" style="--x:64%;--s:36px;--dur:22s;--d:-2s">🐠</span>
  <span class="sc-bit" style="--x:78%;--s:28px;--dur:26s;--d:-11s">O</span>
  <span class="sc-bit" style="--x:90%;--s:38px;--dur:24s;--d:-20s">🫧</span>
</div>

<!-- 타이틀 화면 -->
<section id="screen-title" class="screen active">
  <div class="title-card">
    <div class="title-shapes" aria-hidden="true">
      <span class="ts ts1">🎣</span>
      <span class="ts ts2">🐟</span>
      <span class="ts ts3">_</span>
      <span class="ts ts4">A</span>
    </div>
    <h1 id="title-name">알파벳 낚시</h1>
    <p class="subtitle" id="title-sub">빈칸에 들어갈 알파벳 물고기를 낚아요!</p>
    <button id="btn-start" class="btn btn-primary btn-huge">시작하기</button>
    <div><a class="btn btn-ghost back-link" id="title-back" href="../english/index.html">← 영어 놀이</a></div>
  </div>
</section>

<!-- 사용자 선택 화면 -->
<section id="screen-user" class="screen">
  <div class="card">
    <h2>누구인가요?</h2>
    <div id="user-list" class="user-list"></div>
    <div class="user-new-row">
      <input id="user-name-input" class="user-name-input" type="text" maxlength="10" placeholder="새 이름을 입력하세요">
      <button id="btn-user-new" class="btn btn-primary btn-small">시작</button>
    </div>
    <button id="btn-user-guest" class="btn btn-ghost">게스트로 시작</button>
    <button id="btn-user-back" class="btn btn-ghost">처음으로</button>
  </div>
</section>

<!-- 학년 고르기 -->
<section id="screen-grade" class="screen">
  <h1 class="game-title">알파벳 낚시</h1>
  <div class="card card-wide en-main">
    <div class="gb-top-row"><button id="btn-guide" class="gb-top-btn" type="button">📖 게임 방법</button></div>
    <h2>몇 학년이에요? <span class="user-badge diff-tag"></span></h2>
    <p class="grade-note">학년에 맞는 영어 단어가 나와요</p>
    <div id="grade-grid" class="grade-grid"></div>
    <div class="row-buttons">
      <button id="btn-grade-back" class="btn btn-ghost">처음으로</button>
    </div>
  </div>
</section>

<!-- 게임 화면 -->
<section id="screen-game" class="screen">
  <div class="hud">
    <button id="btn-quit" class="btn btn-ghost btn-small">← 나가기</button>
    <div id="hearts" class="hearts"></div>
    <div class="hud-item"><span class="hud-label">문제</span><span id="hud-q" class="hud-value">1 / 12</span></div>
    <div class="hud-item hud-score" id="hud-score-box"><span class="hud-label">점수</span><span id="hud-score" class="hud-value">0</span></div>
  </div>
  <div class="q-card">
    <div id="q-emoji" class="q-emoji">🐵</div>
    <div class="q-main">
      <div id="q-slots" class="q-slots"></div>
      <div id="q-sub" class="q-sub">원숭이</div>
    </div>
    <button id="btn-say" class="btn-round" type="button" title="다시 듣기">🔊</button>
  </div>
  <div id="game-msg" class="game-msg"></div>
  <div id="field" class="field">
    <canvas id="sea-canvas"></canvas>
    <div class="shoot-pad" id="fish-pad">
      <button class="sp" data-act="left" type="button" aria-label="왼쪽">◀</button>
      <button class="sp sp-fire" data-act="drop" type="button" aria-label="낚싯줄 내리기">🎣<small>내리기</small></button>
      <button class="sp" data-act="right" type="button" aria-label="오른쪽">▶</button>
    </div>
  </div>
</section>

<!-- 결과 화면 -->
<section id="screen-result" class="screen">
  <div class="card">
    <h2 id="result-title">참 잘했어요!</h2>
    <div id="result-stars" class="result-stars"></div>
    <div id="result-text" class="result-text"></div>
    <div id="result-words" class="result-words"></div>
    <div class="row-buttons">
      <button id="btn-again" class="btn btn-primary">🔁 다시 하기</button>
      <button id="btn-result-back" class="btn btn-ghost">학년 고르기</button>
    </div>
  </div>
</section>

<script src="../spelling/words-data.js"></script>
<script src="../spelling/guidebook.js"></script>
<script src="../shared/mul-link.js"></script>
<script src="game.js"></script>
<!-- hub-user -->
<!-- 게임 허브 연결: 시작하기 페이지 건너뛰기 · 고른 사용자로 바로 들어가기 · 이름표를 누르면 사용자 전환 -->
<style>
.hub-switch { cursor: pointer; background: #f5edff; color: #7c2ce0; border: 2px solid #a259ff; border-radius: 999px; padding: 3px 5px 3px 12px; box-shadow: none; white-space: nowrap; }
.hub-switch:hover { background: #ebdcff; border-color: #7c2ce0; }
.hub-switch::after { content: "전환"; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: #7c2ce0; color: #fff; font-size: 0.72em; font-weight: 800; vertical-align: middle; }
</style>
<script>
(function () {
  var C = {"start":"btn-start","guest":"btn-user-guest","input":"user-name-input","submit":"btn-user-new"};
  var hub = null;
  try {
    hub = new URLSearchParams(location.search).get("hub");
    if (hub) sessionStorage.setItem("hub_user", hub); else hub = sessionStorage.getItem("hub_user");
  } catch (e) { /* storage unavailable, ignore */ }
  var $ = function (id) { return id ? document.getElementById(id) : null; };
  var start = $(C.start);
  if (!start) return;
  var shown = function (el) { return !!el && el.getClientRects().length > 0; };

  // 고른 사용자로 '누구인가요?' 화면을 건너뛰어요 (사용자 화면이 열리지 않는 경우는 그대로)
  if (hub && C.guest) start.addEventListener("click", function () {
    var guest = $(C.guest);
    if (!shown(guest)) return;
    if (hub === "guest") { guest.click(); return; }
    $(C.input).value = hub.slice(2);
    $(C.submit).click();
  });

  // 시작하기 페이지 건너뛰기: 처음 열면 '시작하기'를 대신 눌러요.
  // 나중에 '처음으로'로 다시 나오면, 메뉴로 가는 링크(← 영어 놀이 등)가 있으면 그리로, 사용자 화면이 있으면 다시 시작해요
  var scr = start.closest("section, .screen"), back = scr && scr.querySelector(".back-link, #title-back");
  var first = true, queued = false;
  function check() {
    queued = false;
    if (!shown(start) || document.querySelector(".gb-overlay.show, .modal:not(.hidden), .who-overlay.show")) return;
    if (first) { first = false; start.click(); }
    else if (back) back.click();
    else if (C.guest) start.click();
  }
  check();
  first = false;
  // 허브에서 연 게임인데 돌아갈 메뉴 링크가 없으면, 시작 페이지로 가는 '처음으로' 버튼은 할 일이 없어서 숨겨요 (허브의 🏠 를 써요)
  if (hub && !back) Array.prototype.forEach.call(document.querySelectorAll("#changeUser, #userBack, #btn-diff-back, #btn-user-back, #btn-levelselect-title, #btn-to-title, #btn-mode-title"), function (b) { b.style.display = "none"; });
  new MutationObserver(function () { if (!queued) { queued = true; requestAnimationFrame(check); } })
    .observe(document.body, { attributes: true, subtree: true, attributeFilter: ["class", "hidden", "style"] });

  // 이름표(👤 게스트)를 누르면 게임 허브의 '사용자 전환' 팝업이 열려요 (허브 안에서 열었을 때만)
  if (window.parent === window) return;
  var BADGES = ".user-badge, .user-badge-copy, #user-badge, .current-user-badge, #userBadge";
  Array.prototype.forEach.call(document.querySelectorAll(BADGES), function (el) {
    el.classList.add("hub-switch");
    el.title = "사용자 전환";
    el.addEventListener("click", function (e) {
      e.stopPropagation();
      window.parent.postMessage({ type: "hub-switch-user" }, "*");
    });
  });
})();
</script>
<script src="../shared/game-title.js"></script>
<script src="../shared/english-bg.js"></script>
</body>
</html>
