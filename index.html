<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>게임 플레이 존</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="home-screen" class="screen active">
  <div class="bg-decor" aria-hidden="true">
    <span style="--x:6%; --d:0s; --dur:9s;">⭐</span>
    <span style="--x:88%; --d:1.5s; --dur:11s;">🔺</span>
    <span style="--x:20%; --d:3s; --dur:10s;">☁️</span>
    <span style="--x:70%; --d:2s; --dur:8s;">⌨️</span>
    <span style="--x:45%; --d:4s; --dur:12s;">🟦</span>
    <span style="--x:60%; --d:0.5s; --dur:9.5s;">🎮</span>
    <span style="--x:32%; --d:5s; --dur:10.5s;">🕐</span>
  </div>

  <header class="hub-header">
    <div class="hub-title-row">
      <h1>게임 플레이 존</h1>
      <button id="btn-switch-user" class="switch-user" type="button" title="사용자 전환">👤 <span id="hub-user-name">사용자 선택</span> <small>전환</small></button>
    </div>
  </header>

  <main class="tile-grid">
    <button class="tile tile-typing" data-game="typing" type="button">
      <div class="tile-emoji">⌨️</div>
      <div class="tile-title">말랑말랑 타자연습</div>
      <div class="tile-desc">손가락 위치부터 타자게임까지</div>
    </button>
    <button class="tile tile-multiplication" data-game="multiplication" type="button">
      <div class="tile-emoji">🔢</div>
      <div class="tile-title">구구단 놀이터</div>
      <div class="tile-desc">놀면서 구구단을 외워요</div>
    </button>
    <button class="tile tile-english" data-game="english" type="button">
      <div class="tile-emoji">🔤</div>
      <div class="tile-title">영어 놀이 파닉스</div>
      <div class="tile-desc">영어 단어 게임 8가지</div>
    </button>
    <button class="tile tile-talk" data-game="talk" type="button">
      <div class="tile-emoji">💬</div>
      <div class="tile-title">영어 놀이 회화</div>
      <div class="tile-desc">영어로 말해 보는 대화 게임 4가지</div>
    </button>
    <button class="tile tile-clock" data-game="clock" type="button">
      <div class="tile-emoji">🕐</div>
      <div class="tile-title">시계 읽기 놀이</div>
      <div class="tile-desc">몇 시 몇 분인지 맞혀봐요</div>
    </button>
    <button class="tile tile-coding" data-game="coding" type="button">
      <div class="tile-emoji">🐰</div>
      <div class="tile-title">코딩 길찾기</div>
      <div class="tile-desc">명령 블록으로 토끼를 당근까지!</div>
    </button>
    <button class="tile tile-findhidden" data-game="findhidden" type="button">
      <div class="tile-emoji">🔍</div>
      <div class="tile-title">틀린그림 찾기</div>
      <div class="tile-desc">왼쪽과 오른쪽, 다른 곳을 찾아봐요</div>
    </button>
    <button class="tile tile-tangram" data-game="tangram" type="button">
      <div class="tile-emoji">
        <svg viewBox="0 0 100 100" width="46" height="46" aria-hidden="true">
          <polygon points="50,50 0,0 100,0" fill="#ff4fa3"/>
          <polygon points="50,50 100,0 100,100" fill="#2e9bff"/>
          <polygon points="50,50 100,100 0,100" fill="#0e9b45"/>
          <polygon points="50,50 0,100 0,0" fill="#a259ff"/>
        </svg>
      </div>
      <div class="tile-title">탱그램 칠교놀이</div>
      <div class="tile-desc">조각을 맞춰 모양을 완성해요</div>
    </button>
    <button class="tile tile-memory" data-game="memory" type="button">
      <div class="tile-emoji">🃏</div>
      <div class="tile-title">카드 짝맞추기</div>
      <div class="tile-desc">같은 그림 카드를 찾아 짝을 맞춰요</div>
    </button>
    <button class="tile tile-puzzle" data-game="puzzle" type="button">
      <div class="tile-emoji">🧩</div>
      <div class="tile-title">조각 맞추기 퍼즐</div>
      <div class="tile-desc">조각을 끌어서 그림을 완성해요</div>
    </button>
  </main>
</section>

<section id="game-screen" class="screen">
  <nav class="game-nav">
    <button class="nav-home" id="btn-home" type="button" title="홈으로">🏠</button>
    <div class="nav-menu">
      <button class="nav-item" data-game="typing" type="button" title="말랑말랑 타자연습"><span class="nav-ico">⌨️</span><span class="nav-label">말랑말랑 타자연습</span></button>
      <button class="nav-item" data-game="multiplication" type="button" title="구구단 놀이터"><span class="nav-ico">🔢</span><span class="nav-label">구구단 놀이터</span></button>
      <button class="nav-item" data-game="english" type="button" title="영어 놀이 파닉스"><span class="nav-ico">🔤</span><span class="nav-label">영어 놀이 파닉스</span></button>
      <button class="nav-item" data-game="talk" type="button" title="영어 놀이 회화"><span class="nav-ico">💬</span><span class="nav-label">영어 놀이 회화</span></button>
      <button class="nav-item" data-game="clock" type="button" title="시계 읽기 놀이"><span class="nav-ico">🕐</span><span class="nav-label">시계 읽기 놀이</span></button>
      <button class="nav-item" data-game="coding" type="button" title="코딩 길찾기"><span class="nav-ico">🐰</span><span class="nav-label">코딩 길찾기</span></button>
      <button class="nav-item" data-game="findhidden" type="button" title="틀린그림 찾기"><span class="nav-ico">🔍</span><span class="nav-label">틀린그림 찾기</span></button>
      <button class="nav-item" data-game="tangram" type="button" title="탱그램 칠교놀이">
        <svg class="nav-item-icon nav-ico" viewBox="0 0 100 100" width="18" height="18" aria-hidden="true">
          <polygon points="50,50 0,0 100,0" fill="#ff4fa3"/>
          <polygon points="50,50 100,0 100,100" fill="#2e9bff"/>
          <polygon points="50,50 100,100 0,100" fill="#0e9b45"/>
          <polygon points="50,50 0,100 0,0" fill="#a259ff"/>
        </svg>
        <span class="nav-label">탱그램 칠교놀이</span>
      </button>
      <button class="nav-item" data-game="memory" type="button" title="카드 짝맞추기"><span class="nav-ico">🃏</span><span class="nav-label">카드 짝맞추기</span></button>
      <button class="nav-item" data-game="puzzle" type="button" title="조각 맞추기 퍼즐"><span class="nav-ico">🧩</span><span class="nav-label">조각 맞추기 퍼즐</span></button>
    </div>
  </nav>
  <iframe id="game-frame" class="game-frame" src="" title="게임 화면" allow="autoplay"></iframe>
</section>

<!-- 누가 놀까요? 처음 게임을 고르면(또는 사용자 전환을 누르면) 떠요 -->
<div class="who-overlay" id="who" role="dialog" aria-modal="true" aria-labelledby="who-title">
  <div class="who-card">
    <button class="who-close" id="who-close" type="button" aria-label="닫기">✕</button>
    <h2 id="who-title">누가 놀까요?</h2>
    <p class="who-sub" id="who-sub">한 번 고르면 다른 게임도 같은 이름으로 해요</p>
    <div class="who-list" id="who-list"></div>
    <div class="who-new">
      <input id="who-input" type="text" maxlength="10" placeholder="새 이름을 입력하세요" autocomplete="off">
      <button id="who-add" class="who-btn who-primary" type="button">추가하고 시작</button>
    </div>
    <button id="who-guest" class="who-btn who-ghost" type="button">🙂 게스트로 하기</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
