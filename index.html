<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 플레이 존</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-decor" aria-hidden="true">
  <span style="--x:6%; --d:0s; --dur:9s;">⭐</span>
  <span style="--x:88%; --d:1.5s; --dur:11s;">🔺</span>
  <span style="--x:20%; --d:3s; --dur:10s;">☁️</span>
  <span style="--x:70%; --d:2s; --dur:8s;">⌨️</span>
  <span style="--x:45%; --d:4s; --dur:12s;">🟦</span>
  <span style="--x:60%; --d:0.5s; --dur:9.5s;">🎮</span>
</div>

<header class="hub-header">
  <h1>게임 플레이 존</h1>
  <p class="hub-subtitle">하고 싶은 게임을 골라주세요!</p>
</header>

<main class="tile-grid">
  <a class="tile tile-tangram" href="https://tangram-azure.vercel.app" target="_blank" rel="noopener">
    <div class="tile-emoji">🧩</div>
    <div class="tile-title">탱그램 칠교놀이</div>
    <div class="tile-desc">조각을 맞춰 모양을 완성해요</div>
  </a>
  <a class="tile tile-typing" href="https://typing-practice-izqt.vercel.app/" target="_blank" rel="noopener">
    <div class="tile-emoji">⌨️</div>
    <div class="tile-title">말랑말랑 타자연습</div>
    <div class="tile-desc">손가락 위치부터 타자게임까지</div>
  </a>
</main>

</body>
</html>
